<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Home Dashboard</title>
<style>
:root {
  --primary: #3b3fc4;
  --card-dark: #0b1633;
  --card-dark-2: #0f1e45;
  --text-light: #c7d2fe;
  --accent-blue: #22d3ee;
  --accent-pink: #c084fc;
}

* { margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI",sans-serif; }

body { 
  min-height:100vh; 
  display:flex; 
  color:white;
  position: relative;
  overflow-x: hidden;
  background: linear-gradient(120deg,#3b3fc4,#4361ee,#0f1e45,#3b3fc4);
  background-size: 400% 400%;
  animation: gradientShift 15s ease infinite;
}

/* Sidebar */
.sidebar{
  width:240px;
  background:linear-gradient(180deg,#4361ee,#3a0ca3);
  border-radius:0 40px 40px 0;
  padding:24px 16px;
  display:flex;
  flex-direction:column;
  color:white;
  z-index:10;
}
.sidebar h2{ margin-bottom:20px; font-size:18px; }
.sidebar .search{ background:rgba(0,0,0,0.3); padding:8px 12px; border-radius:10px; margin-bottom:20px; }
.sidebar input{ background:transparent; border:none; outline:none; color:white; width:100%; }
.menu a{
  display:block;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  color:#e0e7ff;
  text-decoration:none;
  font-size:14px;
  transition: all 0.3s ease;
}
.menu a.active, .menu a:hover{
  background:rgba(0,0,0,0.25);
  transform: translateX(5px);
}
.profile{ margin-top:auto; display:flex; align-items:center; gap:10px; font-size:13px; }
.avatar{ width:34px; height:34px; background:#22d3ee; border-radius:50%; }

/* Main */
.main{ flex:1; padding:24px 30px; z-index:10; position: relative; }
.topbar{ display:flex; align-items:center; gap:20px; margin-bottom:30px; }
.topbar h1{ font-size:20px; }
.top-search{ background:white; padding:8px 14px; border-radius:20px; width:240px; }
.top-search input{ border:none; outline:none; width:100%; }

/* Dashboard Layout */
.dashboard{
  display:grid;
  grid-template-columns: 1fr 1fr; 
  grid-template-rows: auto auto;
  gap:24px;
}
.card{
  background: linear-gradient(180deg,var(--card-dark),var(--card-dark-2));
  border-radius:18px;
  padding:20px;
  box-shadow:0 20px 40px rgba(0,0,0,0.35);
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  height:350px;
  transform: translateY(50px);
  opacity:0;
  transition: transform 0.5s ease, box-shadow 0.3s ease, opacity 0.5s ease;
}
.card.show{ transform: translateY(0); opacity:1; }
.card:hover{
  transform: translateY(-5px);
  box-shadow:0 25px 50px rgba(0,0,0,0.6), 0 0 25px rgba(34,211,238,0.4);
}
.card h3{ font-size:16px; color:var(--text-light); margin-bottom:12px; }
.value{ font-size:24px; font-weight:bold; margin-bottom:12px; text-shadow: 0 0 5px #22d3ee; animation: pulse 2s infinite; }

/* Card positions */
.monthly{ grid-column:1; grid-row:1; }
.yearly{ grid-column:1; grid-row:2; }
.overall{ grid-column:2; grid-row:1 / span 2; }

canvas{ flex:1; }

@media(max-width:1000px){
  .dashboard{ grid-template-columns:1fr; grid-template-rows:auto; }
  .sidebar{ display:none; }
  .overall{ grid-column:1; grid-row:auto; height:auto; }
}

.btn {
  background:#1e293b; color:#e5e7eb; border:none; padding:4px 10px;
  border-radius:8px; font-size:12px; cursor:pointer; margin-left:6px;
  transition: all 0.2s ease;
}
.btn:hover{ background: rgba(219,39,119,0.4); }

/* Animations */
@keyframes pulse{
  0%,100%{text-shadow:0 0 5px #22d3ee;}
  50%{text-shadow:0 0 20px #22d3ee;}
}
@keyframes gradientShift{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* Floating blobs */
.blob{
  position:absolute;
  width:150px; height:150px;
  background: rgba(34,211,238,0.2);
  border-radius:50%;
  animation: float 12s ease-in-out infinite;
}
.blob:nth-child(1){ top:5%; left:70%; animation-delay:0s; }
.blob:nth-child(2){ top:30%; left:10%; animation-delay:3s; }
.blob:nth-child(3){ top:60%; left:80%; animation-delay:6s; }

@keyframes float{
  0%,100%{transform:translateY(0px);}
  50%{transform:translateY(50px);}
}
</style>
</head>
<body>

<!-- floating blobs -->
<div class="blob"></div>
<div class="blob"></div>
<div class="blob"></div>

<aside class="sidebar">
  <h2>Dashboard</h2>
  <div class="search"><input type="text" placeholder="Search for..." /></div>
  <nav class="menu">
    <a class="active" href="Home.html">Home</a>
    <a href="Analytics.html">Analytics</a>
    <a href="Report.html">Report</a> <!-- updated href -->
  </nav>
  <div class="profile"><div class="avatar"></div>John Carter</div>
</aside>

<main class="main">
  <div class="topbar">
    <h1>Home Page</h1>
    <div class="top-search"><input type="text" placeholder="Search anything here..." /></div>
  </div>

  <section class="dashboard">
    <div class="card monthly">
      <h3>Monthly Sales</h3>
      <div class="value">$240.8K</div>
      <canvas id="monthlyBar"></canvas>
    </div>

    <div class="card yearly">
      <h3>Yearly Sales</h3>
      <div class="value">$144.6K</div>
      <canvas id="yearlyBar"></canvas>
    </div>

    <div class="card overall">
      <h3>Monthly Expenses & Revenue
        <button class="btn" onclick="setRange('monthly')">Monthly</button>
        <button class="btn" onclick="setRange('quarterly')">Quarterly</button>
        <button class="btn" onclick="setRange('yearly')">Yearly</button>
      </h3>
      <canvas id="overallLine"></canvas>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
<script>
window.addEventListener('DOMContentLoaded', ()=>{
  const cards = document.querySelectorAll('.dashboard .card');
  cards.forEach((card,i)=>{
    setTimeout(()=>{ card.classList.add('show'); }, i*200);
  });
});

// Monthly Sales Bar Chart
new Chart(document.getElementById('monthlyBar'), {
  type:'bar',
  data:{ labels:['Jollibee','Prime','KFG','Samsung','Sonia','Singtel'], datasets:[{ data:[20,35,45,30,55,25], backgroundColor:'#22d3ee' }] },
  options:{ plugins:{ legend:{display:false}, datalabels:{ color:'white', anchor:'end', align:'end', font:{weight:'bold'} } }, scales:{ y:{ticks:{color:'white', beginAtZero:true}}, x:{ticks:{color:'white'}} } },
  plugins:[ChartDataLabels]
});

// Yearly Sales Bar Chart
new Chart(document.getElementById('yearlyBar'), {
  type:'bar',
  data:{ labels:['2019','2020','2021','2022','2023','2024'], datasets:[{ data:[80,90,100,110,130,145], backgroundColor:'#22d3ee' }] },
  options:{ plugins:{ legend:{display:false}, datalabels:{ color:'white', anchor:'end', align:'end', font:{weight:'bold'} } }, responsive:true, maintainAspectRatio:false, scales:{ y:{ beginAtZero:true, ticks:{color:'white'}, max:160 }, x:{ ticks:{color:'white'} } } },
  plugins:[ChartDataLabels]
});

// Overall Expenses & Revenue Line Chart
const overallCtx = document.getElementById('overallLine');
const overallChart = new Chart(overallCtx,{
  type:'line',
  data:{ labels:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], datasets:[{ label:'Expenses', data:[10,20,15,25,20,30,35,28,40,35,45,50], borderColor:'#3b82f6', backgroundColor:'rgba(59,130,246,0.2)', fill:true, tension:0.4 },{ label:'Revenue', data:[15,28,22,40,35,50,65,60,70,68,82,90], borderColor:'#22d3ee', backgroundColor:'rgba(34,211,238,0.25)', fill:true, tension:0.4 }] },
  options:{ plugins:{ legend:{display:true, labels:{color:'white'}} }, scales:{ y:{ticks:{color:'white'}}, x:{ticks:{color:'white'}} }, interaction:{ mode:'nearest', axis:'x', intersect:false }, responsive:true, maintainAspectRatio:false }
});

function setRange(type){
  const ranges = {
    monthly:[15,28,22,40,35,50,65,60,70,68,82,90],
    quarterly:[120,140,160,180],
    yearly:[1500,1600,1700,1800,1900]
  };
  overallChart.data.datasets[1].data = ranges[type];
  overallChart.update();
}
</script>
</body>
</html>
