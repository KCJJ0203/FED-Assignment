<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inspection Calendar</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    :root {
      --green-900: #0a5d3c;
      --green-800: #0b7d38;
      --green-700: #0a6a32;
      --page-bg: #f3f6f4;
      --text-dark: #0f172a;
      --text-muted: #6b7280;
      --border: #e2e8f0;
      --completed: #d9fbe7;
      --scheduled: #fff1b8;
      --card-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", Arial, sans-serif;
    }

    body {
      background: var(--page-bg);
      color: var(--text-dark);
      min-height: 100vh;
    }

    .header {
      background: linear-gradient(90deg, var(--green-800), var(--green-700));
      color: #fff;
      padding: 26px 36px 40px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      box-shadow: var(--card-shadow);
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      cursor: pointer;
      color: #fff;
      text-decoration: none;
      margin-bottom: 10px;
    }

    .header h1 {
      font-size: 30px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .header p {
      font-size: 15px;
      opacity: 0.9;
    }

    .filters {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .filter {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 6px;
      background: #fff;
    }

    .legend-dot.completed { background: var(--completed); }
    .legend-dot.scheduled { background: var(--scheduled); }

    .content {
      padding: 30px 36px 50px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 24px;
      align-items: stretch;
    }

    .calendar-card,
    .detail-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      box-shadow: var(--card-shadow);
    }

    .calendar-card {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .calendar-header h2 {
      color: var(--green-800);
      font-size: 26px;
      font-weight: 700;
    }

    .calendar-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .calendar-controls button {
      background: #f1f5f9;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
      color: var(--text-dark);
    }

    .day-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 12px;
      text-align: center;
    }

    .day-name {
      font-weight: 600;
      color: var(--text-muted);
      font-size: 14px;
    }

    .day {
      padding: 14px 10px;
      border-radius: 16px;
      border: 1px solid var(--border);
      font-weight: 600;
      background: #fff;
      min-height: 82px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    .day:hover {
      box-shadow: 0 10px 18px rgba(15, 23, 42, 0.08);
      transform: translateY(-1px);
    }

    .day.completed {
      background: var(--completed);
      border-color: #22c55e;
    }

    .day.scheduled {
      background: var(--scheduled);
      border-color: #facc15;
    }

    .day.completed.scheduled {
      background: linear-gradient(180deg, var(--completed), var(--scheduled));
      border-color: #65a30d;
    }

    .day-number {
      font-size: 16px;
      font-weight: 700;
      line-height: 1;
    }

    .day-labels {
      display: grid;
      gap: 2px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      text-align: center;
      width: 100%;
      line-height: 1.2;
    }

    .detail-card {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--text-muted);
    }

    .detail-card .icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #f1f5f9;
      display: grid;
      place-items: center;
      font-size: 26px;
      color: #94a3b8;
    }

    .detail-card h3 {
      color: var(--text-dark);
      font-size: 18px;
      margin-top: 10px;
    }

    .summary-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 24px;
    }

    .summary-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 120px;
      box-shadow: var(--card-shadow);
    }

    .summary-card .badge {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 18px;
      color: var(--green-800);
      background: #e7f8ee;
    }

    .summary-card h4 {
      font-size: 15px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .summary-card strong {
      font-size: 26px;
      color: var(--text-dark);
      font-weight: 700;
    }

    .summary-card.completed { border-color: #22c55e; }
    .summary-card.completed .badge { background: #d9fbe7; color: #16a34a; }

    .summary-card.scheduled { border-color: #facc15; }
    .summary-card.scheduled .badge { background: #fff4cc; color: #ca8a04; }

    .summary-card.total { border-color: #94a3b8; }
    .summary-card.total .badge { background: #e2e8f0; color: #475569; }

    @media (max-width: 980px) {
      .calendar-grid {
        grid-template-columns: 1fr;
      }

      .summary-row {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      .header {
        padding: 24px 20px 30px;
      }

      .content {
        padding: 24px 20px 36px;
      }
    }
  </style>
</head>

<body>
  <div class="header">
    <div>
      <a class="back" href="index.html">
        <i class="fas fa-chevron-left"></i> Back to Dashboard
      </a>
      <h1>Inspection Calendar</h1>
      <p>View completed and scheduled inspections</p>
    </div>
    <div class="filters">
      <div class="filter">
        <span class="legend-dot completed"></span>
        Completed
      </div>
      <div class="filter">
        <span class="legend-dot scheduled"></span>
        Scheduled
      </div>
    </div>
  </div>

  <div class="content">
    <div class="calendar-grid">
      <div class="calendar-card">
        <div class="calendar-header">
          <h2 id="calendarTitle">Month</h2>
          <div class="calendar-controls">
            <button id="todayBtn">Today</button>
            <button id="prevBtn"><i class="fas fa-chevron-left"></i></button>
            <button id="nextBtn"><i class="fas fa-chevron-right"></i></button>
          </div>
        </div>

        <div class="day-grid" id="dayGrid"></div>
      </div>

      <div class="detail-card" id="detailCard">
        <div class="icon"><i class="far fa-calendar"></i></div>
        <h3>Select a Date</h3>
        <p>Click on any date to view inspection details</p>
      </div>
    </div>

    <div class="summary-row" id="summaryRow">
      <div class="summary-card completed">
        <div class="badge"><i class="fas fa-check-circle"></i></div>
        <h4>Completed</h4>
        <strong>0</strong>
      </div>
      <div class="summary-card scheduled">
        <div class="badge"><i class="far fa-clock"></i></div>
        <h4>Scheduled</h4>
        <strong>0</strong>
      </div>
      <div class="summary-card total">
        <div class="badge"><i class="far fa-calendar"></i></div>
        <h4>Total</h4>
        <strong>0</strong>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBc5jOMf7hfbWa_65JFcdAMwSKyxtLSCvs",
      authDomain: "fed-assignment-9c219.firebaseapp.com",
      projectId: "fed-assignment-9c219",
      storageBucket: "fed-assignment-9c219.firebasestorage.app",
      messagingSenderId: "287410844855",
      appId: "1:287410844855:web:8c15e5cbe42c321b1e0932"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, user => {
      if (!user) window.location.href = "/login.html";
    });

    const dayGrid = document.getElementById("dayGrid");
    const calendarTitle = document.getElementById("calendarTitle");
    const todayBtn = document.getElementById("todayBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const summaryRow = document.getElementById("summaryRow");

    const monthNames = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];

    let currentDate = new Date();

    function loadInspections() {
      return JSON.parse(localStorage.getItem("neaInspections") || "[]");
    }

    function loadSchedules() {
      return JSON.parse(localStorage.getItem("neaSchedules") || "[]");
    }

    function normalizeDateKey(value) {
      if (!value) return "";
      if (typeof value === "string" && /^\d{4}-\d{2}-\d{2}$/.test(value)) {
        return value;
      }
      const parsed = new Date(value);
      if (Number.isNaN(parsed.getTime())) return "";
      return new Date(Date.UTC(
        parsed.getFullYear(),
        parsed.getMonth(),
        parsed.getDate()
      )).toISOString().split("T")[0];
    }

    function buildCompletedMap() {
      const completedByDate = {};

      loadInspections().forEach(entry => {
        const dateKey = normalizeDateKey(entry.scheduleDate || entry.completedAt);
        if (!dateKey) return;
        if (!completedByDate[dateKey]) completedByDate[dateKey] = new Set();
        if (entry.stallId) completedByDate[dateKey].add(entry.stallId);
      });

      return completedByDate;
    }

    function buildDayMap(year, month) {
      const completed = {};
      const scheduled = {};
      const completedByDate = buildCompletedMap();

      loadInspections().forEach(entry => {
        const date = new Date(entry.completedAt);
        if (date.getFullYear() === year && date.getMonth() === month) {
          const key = date.getDate();
          completed[key] = (completed[key] || 0) + 1;
        }
      });

      loadSchedules().forEach(entry => {
        if (!entry.date) return;
        const date = new Date(entry.date);
        if (date.getFullYear() !== year || date.getMonth() !== month) {
          return;
        }
        const dayKey = date.getDate();
        const dateKey = normalizeDateKey(entry.date);
        const completedSet = completedByDate[dateKey] || new Set();
        const scheduleItems = entry.scheduledStalls?.[dateKey] || [];
        const pendingItems = scheduleItems.filter(item => !completedSet.has(item.stallId));
        const fallbackLocations = entry.locations?.[dateKey] || [];
        const pendingCount = pendingItems.length || fallbackLocations.length || 0;
        if (pendingCount) {
          scheduled[dayKey] = (scheduled[dayKey] || 0) + pendingCount;
        }
      });

      return { completed, scheduled, completedByDate };
    }

    function handleDayClick(targetDate, isFuture, scheduledStallId, scheduledCentreId) {
      if (scheduledStallId && scheduledCentreId) {
        localStorage.setItem("selectedStallId", scheduledStallId);
        localStorage.setItem("selectedHawkerCentreId", scheduledCentreId);
        window.location.href = "inspect-stall.html";
        return;
      }

      if (isFuture) {
        alert("Inspection date saved! See you soon!");
        return;
      }

      const inspections = loadInspections();
      if (inspections.length) {
        localStorage.setItem("selectedReportId", inspections[0].id);
      }
      window.location.href = "report.html";
    }

    function renderSummary(month, year) {
      const inspections = loadInspections();
      const schedules = loadSchedules();
      const completedByDate = buildCompletedMap();

      const completedCount = inspections.filter(entry => {
        const date = new Date(entry.completedAt);
        return date.getFullYear() === year && date.getMonth() === month;
      }).length;

      const scheduledCount = schedules.reduce((total, entry) => {
        if (!entry.date) return total;
        const date = new Date(entry.date);
        if (date.getFullYear() !== year || date.getMonth() !== month) {
          return total;
        }
        const dateKey = normalizeDateKey(entry.date);
        const completedSet = completedByDate[dateKey] || new Set();
        const scheduleItems = entry.scheduledStalls?.[dateKey] || [];
        const pendingItems = scheduleItems.filter(item => !completedSet.has(item.stallId));
        const fallbackLocations = entry.locations?.[dateKey] || [];
        return total + (pendingItems.length || fallbackLocations.length || 0);
      }, 0);

      const total = completedCount + scheduledCount;

      summaryRow.innerHTML = `
        <div class="summary-card completed">
          <div class="badge"><i class="fas fa-check-circle"></i></div>
          <h4>Completed</h4>
          <strong>${completedCount}</strong>
        </div>
        <div class="summary-card scheduled">
          <div class="badge"><i class="far fa-clock"></i></div>
          <h4>Scheduled</h4>
          <strong>${scheduledCount}</strong>
        </div>
        <div class="summary-card total">
          <div class="badge"><i class="far fa-calendar"></i></div>
          <h4>Total</h4>
          <strong>${total}</strong>
        </div>
      `;
    }

    function renderCalendar(date) {
      const year = date.getFullYear();
      const month = date.getMonth();
      calendarTitle.textContent = `${monthNames[month]} ${year}`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const { completed, scheduled, completedByDate } = buildDayMap(year, month);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const schedules = loadSchedules();

      const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      dayGrid.innerHTML = dayNames.map(day => `<div class="day-name">${day}</div>`).join("");

      for (let i = 0; i < firstDay; i += 1) {
        dayGrid.innerHTML += `<div></div>`;
      }

      for (let day = 1; day <= daysInMonth; day += 1) {
        const isCompleted = Boolean(completed[day]);
        const isScheduled = Boolean(scheduled[day]);
        const targetDate = new Date(year, month, day);
        targetDate.setHours(0, 0, 0, 0);
        const isFuture = targetDate > today;
        const classes = ["day"];
        if (isCompleted) classes.push("completed");
        if (isScheduled) classes.push("scheduled");

        let label = "";
        if (isCompleted && isScheduled) {
          label = `${completed[day]} done · ${scheduled[day]} scheduled`;
        } else if (isCompleted) {
          label = `${completed[day]} done`;
        } else if (isScheduled) {
          label = `${scheduled[day]} scheduled`;
        }

        const dateKey = new Date(Date.UTC(year, month, day)).toISOString().split("T")[0];
        const scheduleItems = schedules
          .flatMap(entry => entry.scheduledStalls?.[dateKey] || [])
          .filter(Boolean);
        const completedSet = completedByDate[dateKey] || new Set();
        const pendingItems = scheduleItems.filter(item => !completedSet.has(item.stallId));
        const locations = scheduleItems.length
          ? pendingItems.map(item => item.location).filter(Boolean)
          : schedules.flatMap(entry => entry.locations?.[dateKey] || []).filter(Boolean);

        const locationLabel = locations.length ? locations.join(", ") : "";
        const scheduledItem = pendingItems[0];
        const dataAttrs = scheduledItem
          ? `data-stall-id="${scheduledItem.stallId}" data-centre-id="${scheduledItem.centreId}"`
          : "";

        const labelContent = [label, locationLabel].filter(Boolean).map(text => `<div>${text}</div>`).join("");

        dayGrid.innerHTML += `
          <button type="button" class="${classes.join(" ")}" data-date="${targetDate.toISOString()}" ${dataAttrs}>
            <div class="day-number">${day}</div>
            ${labelContent ? `<div class="day-labels">${labelContent}</div>` : ""}
          </button>
        `;
      }

      document.querySelectorAll(".day[data-date]").forEach(dayButton => {
        const dateValue = new Date(dayButton.dataset.date);
        dateValue.setHours(0, 0, 0, 0);
        const isFuture = dateValue > today;
        const scheduledStallId = dayButton.dataset.stallId;
        const scheduledCentreId = dayButton.dataset.centreId;
        dayButton.addEventListener("click", () => handleDayClick(
          dateValue,
          isFuture,
          scheduledStallId,
          scheduledCentreId
        ));
      });

      renderSummary(month, year);
    }

    todayBtn.addEventListener("click", () => {
      currentDate = new Date();
      renderCalendar(currentDate);
    });

    prevBtn.addEventListener("click", () => {
      currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1);
      renderCalendar(currentDate);
    });

    nextBtn.addEventListener("click", () => {
      currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1);
      renderCalendar(currentDate);
    });

    renderCalendar(currentDate);

    const selectedCalendarDate = localStorage.getItem("selectedCalendarDate");
    if (selectedCalendarDate) {
      const parsedDate = new Date(selectedCalendarDate);
      if (!Number.isNaN(parsedDate.getTime())) {
        currentDate = parsedDate;
        renderCalendar(currentDate);
      }
      localStorage.removeItem("selectedCalendarDate");
    }
  </script>
</body>
</html>
