<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Select Stall</title>
  <link rel="stylesheet" href="../css/design-tokens.css">

  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    rel="stylesheet"
  >

  <style>
    :root {
      --green-900: #046a51;
      --green-800: #057a5f;
      --green-700: #06886b;
      --white: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --page-bg: #f5f9f7;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", Arial, sans-serif;
    }

    body {
      background: var(--page-bg);
      min-height: 100vh;
      color: var(--text-dark);
    }

    .header {
      background: #007e63;
      color: var(--white);
      padding: 26px 40px 36px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 16px;
      color: var(--white);
      text-decoration: none;
    }

    .header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .header p,
    .header .address {
      font-size: 16px;
      opacity: 0.95;
      margin-bottom: 4px;
    }

    .header .address {
      font-size: 15px;
      opacity: 0.9;
    }

    .header-actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 22px;
      margin-top: 26px;
      align-items: stretch;
    }

    .schedule-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 20px 24px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.1);
      display: grid;
      gap: 18px;
    }

    .schedule-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-dark);
    }

    .schedule-icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: #00b37a;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    .schedule-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field label {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .field .input-wrap {
      margin-top: 8px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .field .input-wrap i {
      color: #00a471;
      font-size: 18px;
    }

    .field input {
      border: none;
      background: transparent;
      font-size: 16px;
      width: 100%;
      outline: none;
      color: var(--text-dark);
    }

    .info-card {
      background: #00966f;
      border-radius: 20px;
      padding: 24px;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
    }

    .info-card h3 {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .info-card strong {
      font-size: 42px;
      font-weight: 700;
      margin-top: 10px;
    }

    .info-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: grid;
      place-items: center;
      font-size: 24px;
      align-self: flex-end;
    }

    .scheduled-bar {
      margin-top: 20px;
      border-left: 4px solid #00a471;
      border-radius: 16px;
      padding: 14px 18px;
      font-size: 15px;
      color: #046a51;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f5f7fb;
    }

    .content {
      padding: 32px 40px 48px;
    }

    .title {
      color: var(--text-dark);
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--text-muted);
      font-size: 15px;
      margin-bottom: 22px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      border: 1px solid var(--border);
      padding: 18px;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.05);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .stall-number {
      font-weight: 700;
      color: #047857;
      font-size: 15px;
    }

    .grade-pill {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 600;
    }

    .grade-a { background: #dcfce7; color: #15803d; }
    .grade-b { background: #fef3c7; color: #b45309; }
    .grade-c { background: #fee2e2; color: #b91c1c; }
    .grade-d { background: #fecaca; color: #991b1b; }

    .card h3 {
      font-size: 17px;
    }

    .desc {
      font-size: 14px;
      color: var(--text-muted);
    }

    .last {
      font-size: 13px;
      color: var(--text-muted);
    }

    .last strong {
      color: #047857;
      display: block;
      margin-top: 4px;
    }

    .message {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      color: #666;
    }

    @media (max-width: 1000px) {
      .header-actions {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      .header {
        padding: 24px 20px 30px;
      }

      .content {
        padding: 24px 20px 36px;
      }
    }
    @media (max-width: 768px) {

  .hero {
    grid-template-columns: 1fr;
  }

  .schedule-fields {
    grid-template-columns: 1fr;
  }

  .confirm-bar {
    font-size: 14px;
    padding: 14px;
  }

  .stall-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 768px) {

  body {
    font-size: 14px;
  }

  .header {
    padding: 20px 16px 28px;
  }

  .content {
    padding: 20px 16px 32px;
  }

  h1 {
    font-size: 24px !important;
  }

  h2 {
    font-size: 20px !important;
  }

  h3 {
    font-size: 17px !important;
  }

  .back {
    font-size: 14px;
  }

  button, .card, .stall-card {
    touch-action: manipulation;
  }
}

  </style>
</head>

<body>
  <nav aria-label="NEA Navigation" hidden></nav>
  <main>
  <div class="header">
    <a class="back" href="index.html">
      <i class="fas fa-chevron-left"></i> Back to Dashboard
    </a>

    <h1 id="centreName">Hawker Centre</h1>
    <p id="centreLocation"></p>
    <div class="address" id="centreAddress"></div>

    <div class="header-actions">
      <div>
        <div class="schedule-card">
          <div class="schedule-title">
            <div class="schedule-icon"><i class="far fa-calendar"></i></div>
            Schedule Inspection
          </div>
          <div class="schedule-fields">
            <div class="field">
              <label for="scheduleDate">Date</label>
              <div class="input-wrap">
                <i class="far fa-calendar"></i>
                <input type="date" id="scheduleDate">
              </div>
            </div>
            <div class="field">
              <label for="scheduleTime">Time</label>
              <div class="input-wrap">
                <i class="far fa-clock"></i>
                <input type="time" id="scheduleTime" value="10:00">
              </div>
            </div>
          </div>
        </div>
        <div class="scheduled-bar" id="scheduledBar">
          <i class="far fa-calendar"></i>
          Scheduled for: Not set
        </div>
      </div>
      <div class="info-card">
        <div>
          <h3><i class="fas fa-store"></i> Stalls Available</h3>
          <strong id="stallCount">0</strong>
        </div>
        <div class="info-icon"><i class="fas fa-store"></i></div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="title">Select a stall to inspect</div>
    <div class="subtitle">Click on any stall to begin the inspection process</div>
    <div id="stallList" class="cards"></div>
  </div>
<script src="../js/app-firebase.js"></script>
  <script src="../js/app-storage.js"></script>
  <script type="module">
  import {
    collection, getDocs, query, where, doc, getDoc
  } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

  const { auth, onAuthStateChanged } = await window.AppFirebase.getAuth();
  const db = await window.AppFirebase.getFirestoreDb();
  const storageApi = window.AppStorage || null;
  const storageKeys = storageApi ? storageApi.KEYS : {};
  const STORAGE = {
    centreId: storageKeys.NEA_SELECTED_CENTRE_ID || "selectedHawkerCentreId",
    schedules: storageKeys.NEA_SCHEDULES || "neaSchedules",
    calendarDate: storageKeys.NEA_SELECTED_CALENDAR_DATE || "selectedCalendarDate",
    calendarStallId: storageKeys.NEA_SELECTED_CALENDAR_STALL_ID || "selectedCalendarStallId"
  };

  const readLocalJson = (key, fallback) => {
    if (storageApi && typeof storageApi.readJSON === "function") {
      return storageApi.readJSON(localStorage, key, fallback);
    }
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (error) {
      return fallback;
    }
  };

  const writeLocalJson = (key, value) => {
    if (storageApi && typeof storageApi.writeJSON === "function") {
      storageApi.writeJSON(localStorage, key, value);
      return;
    }
    localStorage.setItem(key, JSON.stringify(value));
  };

  onAuthStateChanged(auth, user => {
    if (!user) window.location.href = "../login.html";
  });

  const centreId = localStorage.getItem(STORAGE.centreId);
  if (!centreId) window.location.href = "index.html";

  const scheduleDate = document.getElementById("scheduleDate");
  const scheduleTime = document.getElementById("scheduleTime");
  const scheduledBar = document.getElementById("scheduledBar");

  function loadSchedules() {
    return readLocalJson(STORAGE.schedules, []);
  }

  function saveSchedules(data) {
    writeLocalJson(STORAGE.schedules, data);
  }

  function saveSchedule() {
    if (!scheduleDate.value || !scheduleTime.value) return;

    const schedules = loadSchedules();
    const centreName = document.getElementById("centreName").textContent;

    let entry = schedules.find(s => s.centreId === centreId);
    if (!entry) {
      entry = {
        centreId,
        centreName,
        time: scheduleTime.value,
        scheduledStalls: {}
      };
      schedules.push(entry);
    }

    entry.time = scheduleTime.value;
    if (!entry.scheduledStalls[scheduleDate.value]) {
      entry.scheduledStalls[scheduleDate.value] = [];
    }

    saveSchedules(schedules);
    updateScheduleBar();
  }

  function updateScheduleBar() {
    if (!scheduleDate.value || !scheduleTime.value) {
      scheduledBar.textContent = "Scheduled for: Not set";
      return;
    }

    const d = new Date(`${scheduleDate.value}T${scheduleTime.value}`);
    scheduledBar.textContent =
      `Scheduled for: ${d.toLocaleDateString("en-SG", {
        day: "numeric", month: "short", year: "numeric"
      })} at ${scheduleTime.value}`;
  }

  scheduleDate.addEventListener("change", saveSchedule);
  scheduleTime.addEventListener("change", saveSchedule);

  const centreSnap = await getDoc(doc(db, "hawkers", centreId));
  document.getElementById("centreName").textContent = centreSnap.data().name;

  const q = query(collection(db, "stalls"), where("hawkerId", "==", centreId));
  const snap = await getDocs(q);
  const stallList = document.getElementById("stallList");
  stallList.innerHTML = "";

  snap.forEach(docSnap => {
    const d = docSnap.data();
    stallList.innerHTML += `
      <div class="card" data-id="${docSnap.id}">
        <h3>${d.name}</h3>
        <div class="stall-number">${d.location || ""}</div>
      </div>`;
  });

  document.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => {
      saveSchedule();
      const schedules = loadSchedules();
      const entry = schedules.find(s => s.centreId === centreId);

      const dateKey = scheduleDate.value;
      if (!entry.scheduledStalls[dateKey]) {
        entry.scheduledStalls[dateKey] = [];
      }

      const scheduledStalls = entry.scheduledStalls[dateKey];
      const exists = scheduledStalls.some(item => (
        String(item.stallId) === String(card.dataset.id)
      ));

      if (!exists) {
        scheduledStalls.push({
          stallId: card.dataset.id,
          centreId,
          location: card.querySelector(".stall-number")?.textContent || ""
        });
      }

      saveSchedules(schedules);

      localStorage.setItem(STORAGE.calendarDate, dateKey);
      localStorage.setItem(STORAGE.calendarStallId, card.dataset.id);
      window.location.href = "calendar.html";
    });
  });
</script>

  </main>
</body>
</html>
