<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Management | HawkerHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <nav class="sidebar">
        <div>
            <div class="brand">
                <div class="brand-icon"><i class="fas fa-store"></i></div>
                HawkerHub
            </div>
            <ul class="nav-links">
                <li><a href="index.html"><i class="fas fa-th-large"></i> Overview</a></li>
                <li><a href="orders.html"><i class="fas fa-clipboard-list"></i> Order Management</a></li>
                <li><a href="menu.html" class="active"><i class="fas fa-utensils"></i> Menu Items</a></li>
                <li><a href="notifications.html"><i class="fas fa-bell"></i> Notifications</a></li>
                <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
            </ul>
        </div>
        <div class="user-profile">
            <div class="user-avatar"></div>
            <div>
                <div style="font-weight: bold; font-size: 14px;">Uncle Tan</div>
                <div style="font-size: 12px; color: #777;">Stall #04-21</div>
            </div>
        </div>
        <div class="account-actions">
            <a class="sign-out-link" href="../login.html">
                <i class="fas fa-sign-out-alt"></i> Sign out
            </a>
        </div>

    </nav>

    <main class="main-content">
        <header style="height: 80px !important; min-height: 80px !important; background-color: #1A237E; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: space-between; padding: 0 30px;">
            <div class="header-title">
                <i class="fas fa-bars" style="margin-right: 15px; cursor: pointer; color: white; font-size: 22px;"></i>
                <strong style="font-size: 22px;">Uncle Lim Chicken Rice</strong>
            </div>
            <div class="header-icons">
                <div style="display: flex; align-items: center; gap: 10px; margin-right: 30px; background: rgba(255,255,255,0.15); padding: 6px 16px; border-radius: 30px;">
                    <span style="font-size: 13px; color: #eee; font-weight: 500;">Store Status</span>
                    <i class="fas fa-toggle-on" style="color: #69F0AE; font-size: 24px;"></i>
                    <span style="font-size: 13px; font-weight: bold; color: white;">OPEN</span>
                </div>
                <i class="fas fa-bell" style="color: white; font-size: 20px; margin-right: 20px; cursor: pointer;"></i>
                <div class="user-avatar" style="width: 40px; height: 40px; background-color: white; color: #1A237E; display:flex; align-items:center; justify-content:center; border-radius: 50%; font-weight:bold; font-size:15px;">UT</div>
            </div>
        </header>

        <div class="dashboard-container">
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <div>
                    <h2 style="margin: 0;">Menu Items</h2>
                    <p style="margin: 5px 0 0; color: #777;">Manage your dishes, prices, and availability.</p>
                </div>
                <button class="btn-green" style="width: auto; padding: 12px 24px;" onclick="openAddModal()">
                    <i class="fas fa-plus"></i> ADD NEW ITEM
                </button>
            </div>

            <div class="category-tabs" style="margin-bottom: 25px;">
                <div class="cat-pill active" onclick="filterMenu('All', this)">All</div>
                <div class="cat-pill" onclick="filterMenu('Mains', this)">Mains</div>
                <div class="cat-pill" onclick="filterMenu('Sides', this)">Sides</div>
                <div class="cat-pill" onclick="filterMenu('Drinks', this)">Drinks</div>
                <div class="cat-pill" onclick="filterMenu('Add-ons', this)">Add-ons</div>
            </div>

            <div class="menu-grid" id="admin-menu-grid">
                </div>

        </div>
    </main>

    <div id="itemModal" class="modal-overlay">
        <div class="modal-content" style="width: 500px;">
            <div class="modal-header">
                <h3 id="modal-title">Add New Item</h3>
                <span class="close-btn" onclick="closeItemModal()">&times;</span>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-doc-id">
                
                <div style="margin-bottom: 15px;">
                    <label style="display:block; margin-bottom:5px; font-weight:bold; font-size:14px;">Item Name</label>
                    <input type="text" id="inp-name" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:6px;" placeholder="e.g. Steamed Chicken Rice">
                </div>

                <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                    <div style="flex: 1;">
                        <label style="display:block; margin-bottom:5px; font-weight:bold; font-size:14px;">Price ($)</label>
                        <input type="number" id="inp-price" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:6px;" placeholder="4.50">
                    </div>
                    <div style="flex: 1;">
                        <label style="display:block; margin-bottom:5px; font-weight:bold; font-size:14px;">Category</label>
                        <select id="inp-category" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:6px;">
                            <option>Mains</option>
                            <option>Sides</option>
                            <option>Drinks</option>
                            <option>Add-ons</option>
                            <option>Sets</option>
                        </select>
                    </div>
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display:block; margin-bottom:5px; font-weight:bold; font-size:14px;">Image URL</label>
                    <input type="text" id="inp-image" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:6px;" placeholder="https://...">
                    <small style="color:#888;">Paste a link to an image.</small>
                </div>

                <button class="btn-green" onclick="saveItem()">SAVE ITEM</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>
