<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Guest - Cart</title>
    <link rel="stylesheet" href="../css/design-tokens.css">
    <link rel="stylesheet" href="../css/customer-guest.css">
</head>
<body>
    <section class="app-shell" aria-label="Guest layout">
        <main class="guest-main">
            <section class="cart-shell" aria-label="Cart and checkout">
                <header class="cart-header">
                    <h1 class="guest-title">My Cart</h1>
                    <p id="cart-summary" class="guest-status" role="status" aria-live="polite">Loading cart...</p>
                </header>

                <section class="cart-panel">
                    <div id="cart-empty" class="empty-state is-hidden">
                        <h2 class="empty-title">Your cart is empty</h2>
                        <p class="empty-text">Add items from a stall menu to get started.</p>
                        <a class="primary-button" href="index.html">Browse stalls</a>
                    </div>
                    <div id="cart-items" class="cart-items" role="list"></div>
                </section>

                <section class="cart-summary-sheet" aria-label="Order summary">
                    <div class="totals-panel">
                        <h2 class="section-title">Order Summary</h2>
                        <div class="totals-row">
                            <span>Subtotal</span>
                            <span id="total-subtotal">$0.00</span>
                        </div>
                        <div class="totals-row">
                            <span>Service fee</span>
                            <span id="total-service">$0.00</span>
                        </div>
                        <div class="totals-row">
                            <span>Delivery fee</span>
                            <span id="total-delivery">$0.00</span>
                        </div>
                        <div class="totals-row total">
                            <span>Total:</span>
                            <span id="total-grand">$0.00</span>
                        </div>
                    </div>

                    <section class="checkout-section" aria-labelledby="checkout-title">
                        <h2 id="checkout-title" class="section-title">Checkout</h2>
                        <form id="checkout-form" class="checkout-form" novalidate>
                            <fieldset class="form-group" data-group="fulfillment">
                                <legend>Order type</legend>
                                <div class="radio-group">
                                    <label class="radio-card">
                                        <input type="radio" name="fulfillment" value="dinein" checked>
                                        <span>Dine In</span>
                                    </label>
                                    <label class="radio-card">
                                        <input type="radio" name="fulfillment" value="takeaway">
                                        <span>Takeaway</span>
                                    </label>
                                </div>
                                <p class="field-error" data-error-for="fulfillment" role="alert" aria-live="polite"></p>
                            </fieldset>

                            <div class="form-field">
                                <label for="paymentResult">Simulate payment result</label>
                                <select id="paymentResult">
                                    <option value="success">Success</option>
                                    <option value="fail">Fail</option>
                                </select>
                            </div>
                            <div class="form-field">
                                <label>
                                    <input id="deliveryToggle" type="checkbox">
                                    Delivery (+$3.00)
                                </label>
                            </div>
                            <p id="payment-msg" class="form-error" role="alert" aria-live="polite"></p>
                            <p id="form-error" class="form-error" role="alert" aria-live="polite"></p>

                            <button class="primary-button cart-place-button" type="submit">Place order</button>
                        </form>
                </section>
                </section>
            </section>
        </main>

        <footer class="bottom-nav">
            <nav aria-label="Primary">
                <ul class="nav-list">
                    <li>
                        <a class="nav-link" href="index.html">
                            <span class="nav-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 10.8L12 3l9 7.8"></path>
                                    <path d="M5 9.8v10a1.8 1.8 0 0 0 1.8 1.8h10.4A1.8 1.8 0 0 0 19 19.8v-10"></path>
                                    <path d="M10 21v-6h4v6"></path>
                                </svg>
                            </span>
                            <span class="nav-label">Browse</span>
                        </a>
                    </li>
                    <li>
                        <a class="nav-link is-active" href="cart.html" aria-current="page">
                            <span class="nav-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 5h2l2.2 10.4a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6l1.2-6.8H7.2"></path>
                                    <circle cx="10" cy="20" r="1.6"></circle>
                                    <circle cx="18" cy="20" r="1.6"></circle>
                                </svg>
                            </span>
                            <span class="nav-label">Cart</span>
                        </a>
                    </li>
                    <li>
                        <a class="nav-link" href="orders.html">
                            <span class="nav-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="6" y="4" width="12" height="16" rx="2"></rect>
                                    <path d="M9 3h6"></path>
                                    <path d="M9 10h6"></path>
                                    <path d="M9 14h6"></path>
                                </svg>
                            </span>
                            <span class="nav-label">Orders</span>
                        </a>
                    </li>
                    <li>
                        <a class="nav-link" href="account.html">
                            <span class="nav-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="8" r="3.4"></circle>
                                    <path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path>
                                </svg>
                            </span>
                            <span class="nav-label">Account</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </footer>
    </section>
    <script src="../js/app-firebase.js" defer></script>
    <script src="../js/app-storage.js" defer></script>
    <script src="../js/customer-guest-cart-utils.js" defer></script>
    <script src="../js/customer-guest-cart.js" defer></script>
</body>
</html>
