<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Officer Dashboard</title>

  <!-- Font Awesome for icons -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    rel="stylesheet"
  >

  <style>
    /* CSS Variable Definitions for consistent theming */
    :root {
      --green-900: #046a51;
      --green-800: #057a5f;
      --green-700: #06886b;
      --white: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --card-border: #e2e8f0;
      --page-bg: #f5f9f7;
    }

    /* Global reset and base font */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", Arial, sans-serif;
    }

    /* Body background and text color */
    body {
      background: var(--page-bg);
      min-height: 100vh;
      color: var(--text-dark);
    }

    /* Header section with gradient background */
    .header {
  background: linear-gradient(180deg, #0f766e, #065f46);
  color: #fff;
  padding: 28px 24px 40px;
  border-bottom-left-radius: 24px;
  border-bottom-right-radius: 24px;
  box-shadow: 0 4px 12px rgba(6, 95, 70, 0.35);
}

    /* Header top section with profile and actions */
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    /* Profile section container */
    .profile {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Profile icon circle */
    .profile-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.15);
      color: var(--white);
      display: grid;
      place-items: center;
      font-size: 22px;
      cursor: pointer;
    }

    /* Welcome message title */
    .welcome h1 {
      font-size: 22px;
      font-weight: 600;
    }

    /* Welcome message subtitle */
    .welcome p {
      margin-top: 6px;
      font-size: 15px;
      opacity: 0.9;
    }

    /* Header action buttons container */
    .header-actions {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    /* Individual action button styling */
    .action-btn {
      border: none;
      background: transparent;
      color: var(--white);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Statistics cards grid */
    .stats {
      margin-top: 30px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    /* Individual statistics card */
    .stat-card {
      background: var(--white);
      border-radius: 18px;
      padding: 22px 24px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      border: 1px solid #eef2f7;
      text-align: left;
    }

    /* Reset button styling for stat cards */
    .stat-card button {
      all: unset;
      display: block;
      cursor: pointer;
    }

    /* Statistics card title */
    .stat-title {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* Statistics card value */
    .stat-value {
      font-size: 40px;
      font-weight: 700;
      color: var(--text-dark);
    }

    /* Statistics card subtitle */
    .stat-sub {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Main content area */
    .content {
      padding: 24px;
      margin-top: -20px;
      background: var(--page-bg);
    }

    /* Content header section */
    .content-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 22px;
    }

    /* Blue colored title */
    .blue-title {
      color: #1f5cff;
      font-size: 20px;
      font-weight: 600;
    }

    /* Subtitle text */
    .subtitle {
      margin-top: 6px;
      font-size: 16px;
      color: var(--text-muted);
    }

    /* Date display pill */
    .date-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--white);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 16px;
      color: var(--text-dark);
      font-size: 15px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
    }

    /* Grid for hawker centre cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    /* Individual hawker centre card */
    .centre-card {
      background: var(--white);
      border: 1px solid #e7eef1;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    /* Card hover effect */
    .centre-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.12);
    }

    /* Card image section */
    .centre-image {
      position: relative;
      height: 180px;
      overflow: hidden;
    }

    /* Centre image styling */
    .centre-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Grade badge on image */
    .centre-image .grade-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 18px;
      border: 2px solid rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.95);
    }

    /* Card information section */
    .centre-info {
      padding: 18px 20px 20px;
      display: grid;
      gap: 10px;
    }

    /* Centre name title */
    .centre-title {
      font-size: 20px;
      font-weight: 700;
    }

    /* Metadata line (area, etc.) */
    .meta-line {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 15px;
    }

    /* Address text */
    .address {
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Divider line */
    .divider {
      height: 1px;
      background: #edf2f6;
      margin: 8px 0;
    }

    /* Card bottom section */
    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Last inspection info */
    .last-inspection {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Last inspection date */
    .last-inspection strong {
      display: block;
      color: #008c6a;
      font-weight: 600;
      margin-top: 4px;
    }

    /* Stall count info */
    .stall-info {
      text-align: right;
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Stall count value */
    .stall-info strong {
      display: block;
      color: var(--text-dark);
      font-size: 18px;
      margin-top: 4px;
    }

    /* Grade color coding */
    .grade-a { background: #dcfce7; color: #15803d; }
    .grade-b { background: #fef3c7; color: #b45309; }
    .grade-c { background: #fee2e2; color: #b91c1c; }
    .grade-d { background: #fecaca; color: #991b1b; }

    /* Message box for empty states */
    .message-box {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      color: #64748b;
      border: 1px dashed #cbd5f5;
    }

    /* Tablet responsive breakpoint */
    @media (max-width: 900px) {
      .header {
        padding: 24px 24px 32px;
      }

      .content {
        padding: 28px 24px 40px;
      }

      .header-top {
        flex-direction: column;
        align-items: flex-start;
      }

      .header-actions {
        width: 100%;
        justify-content: flex-start;
      }

      .centre-image {
        height: 160px;
      }
    }

    /* =========================
   GLOBAL MOBILE STYLES
   ========================= */
@media (max-width: 768px) {

  /* Reduce base font size on mobile */
  body {
    font-size: 14px;
  }

  /* Reduce header padding on mobile */
  .header {
    padding: 20px 16px 28px;
  }

  /* Reduce content padding on mobile */
  .content {
    padding: 20px 16px 32px;
  }

  /* Smaller heading sizes on mobile */
  h1 {
    font-size: 24px !important;
  }

  h2 {
    font-size: 20px !important;
  }

  h3 {
    font-size: 17px !important;
  }

  /* Smaller back button text */
  .back {
    font-size: 14px;
  }

  /* Improve touch targets on mobile */
  button, .card, .stall-card {
    touch-action: manipulation;
  }
}

  </style>
</head>

<body>
  <!-- Header section with profile and statistics -->
  <div class="header">
    <div class="header-top">
      <!-- Profile section -->
      <div class="profile">
        <button class="profile-icon" id="logoutBtn" aria-label="Logout">
          <i class="fas fa-user"></i>
        </button>
        <div class="welcome">
          <h1>Welcome back, Officer NEA-12345</h1>
          <p>Food Establishment Inspection System</p>
        </div>
      </div>
      <!-- Header action buttons -->
      <div class="header-actions">
        <button class="action-btn" id="calendarBtn" type="button">
          <i class="fas fa-calendar"></i>
          Calendar
        </button>
        <button class="action-btn" id="historyBtn" type="button">
          <i class="fas fa-history"></i>
          History
        </button>
        <button class="action-btn" id="logoutActionBtn" type="button">
          <i class="fas fa-right-from-bracket"></i>
          Logout
        </button>
      </div>
    </div>

    <!-- Statistics cards -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-title">Total Food Centres</div>
        <div class="stat-value" id="foodCentreCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Total Stalls</div>
        <div class="stat-value" id="stallCount">0</div>
      </div>
      <div class="stat-card" id="todayCard">
        <button type="button">
          <div class="stat-title">Today</div>
          <div class="stat-value" id="todayCount">0</div>
        </button>
      </div>
      <div class="stat-card">
        <div class="stat-title">Avg Grade</div>
        <div class="stat-value" id="avgGrade">-</div>
        <div class="stat-sub">
          <i class="fas fa-arrow-trend-up"></i>
          Stable
        </div>
      </div>
    </div>
  </div>

  <!-- Main content area -->
  <div class="content">
    <!-- Content header with title and date -->
    <div class="content-header">
      <div>
        <h2 class="blue-title">Schedule your next inspection!</h2>
        <p class="subtitle">Select a food centre to begin inspection workflow</p>
      </div>
      <div class="date-pill">
        <i class="far fa-calendar"></i>
        <span id="todayDate">Loading date...</span>
      </div>
    </div>
    <!-- Hawker centres list (populated by JavaScript) -->
    <div id="centresList" class="cards"></div>
  </div>

  <script type="module">
    // Import Firebase modules
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBc5jOMf7hfbWa_65JFcdAMwSKyxtLSCvs",
      authDomain: "fed-assignment-9c219.firebaseapp.com",
      projectId: "fed-assignment-9c219",
      storageBucket: "fed-assignment-9c219.firebasestorage.app",
      messagingSenderId: "287410844855",
      appId: "1:287410844855:web:8c15e5cbe42c321b1e0932"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Check authentication status and redirect if not logged in
    onAuthStateChanged(auth, user => {
      if (!user) window.location.href = "/login.html";
    });

    // DOM element reference
    const list = document.getElementById("centresList");
    list.innerHTML = `<div class="message-box">Loading food centres...</div>`;

    // Display current date
    document.getElementById("todayDate").textContent = new Date().toLocaleDateString(
      "en-SG",
      { weekday: "long", day: "numeric", month: "long", year: "numeric" }
    );

    // Convert date to local date key (YYYY-MM-DD)
    function toLocalDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    // Get set of stalls completed today
    function getCompletedTodaySet(todayKey) {
      const inspections = JSON.parse(localStorage.getItem("neaInspections") || "[]");
      return new Set(
        inspections
          .filter(entry => entry.completedAt && toLocalDateKey(new Date(entry.completedAt)) === todayKey)
          .map(entry => entry.stallId)
          .filter(Boolean)
      );
    }

    // Get count of today's inspections (scheduled + completed)
    function getTodayCount() {
  const todayKey = toLocalDateKey(new Date());
  const schedules = JSON.parse(localStorage.getItem("neaSchedules") || "[]");
  const inspections = JSON.parse(localStorage.getItem("neaInspections") || "[]");

  // Count completed inspections today
  const completedToday = inspections.filter(i =>
    i.completedAt && toLocalDateKey(new Date(i.completedAt)) === todayKey
  ).length;

  // Count scheduled inspections today
  const scheduledToday = schedules.reduce((sum, entry) => {
    return sum + (entry.scheduledStalls?.[todayKey]?.length || 0);
  }, 0);

  return scheduledToday + completedToday;
}

    // Fetch hawker centres and stalls from Firestore
    const [centresSnap, stallsSnap] = await Promise.all([
      getDocs(collection(db, "hawkers")),
      getDocs(collection(db, "stalls"))
    ]);

    // Default fallback image
    const fallbackImage = "../image/default-hawker.jpg";

    // Normalize image URL to proper format
    function normalizeImageUrl(url) {
      if (!url) return fallbackImage;
      if (url.startsWith("http://") || url.startsWith("https://")) return url;
      if (url.startsWith("./") || url.startsWith("../")) return url;
      if (url.startsWith("/image/") || url.startsWith("/images/")) return `..${url}`;
      if (url.startsWith("image/") || url.startsWith("images/")) return `../${url}`;
      return url;
    }

    // Build maps for stall counts and grades by centre
    const stallCounts = {};
    const stallLocationsByCentre = {};
    const gradeTotals = {};
    const gradeMap = { A: 4, B: 3, C: 2, D: 1 };

    // Process each stall
    stallsSnap.forEach(stallDoc => {
      const stall = stallDoc.data();
      const hawkerId = stall.hawkerId;
      if (!hawkerId) return;

      // Count stalls per centre
      stallCounts[hawkerId] = (stallCounts[hawkerId] || 0) + 1;
      
      // Collect unique locations per centre
      if (!stallLocationsByCentre[hawkerId]) {
        stallLocationsByCentre[hawkerId] = new Set();
      }
      if (stall.location) {
        stallLocationsByCentre[hawkerId].add(stall.location);
      }

      // Calculate grade totals per centre
      if (!gradeTotals[hawkerId]) {
        gradeTotals[hawkerId] = { sum: 0, count: 0 };
      }

      const gradeValue = gradeMap[stall.grade] || 0;
      if (gradeValue) {
        gradeTotals[hawkerId].sum += gradeValue;
        gradeTotals[hawkerId].count += 1;
      }
    });

    // Calculate overall average grade across all centres
    const totalGrade = Object.values(gradeTotals).reduce(
      (acc, entry) => {
        return {
          sum: acc.sum + entry.sum,
          count: acc.count + entry.count
        };
      },
      { sum: 0, count: 0 }
    );

    const overallAvg = totalGrade.count ? totalGrade.sum / totalGrade.count : 0;
    const overallGrade = overallAvg >= 3.5 ? "A" : overallAvg >= 2.5 ? "B" : overallAvg >= 1.5 ? "C" : overallAvg > 0 ? "D" : "-";

    // Update dashboard statistics
    document.getElementById("foodCentreCount").textContent = centresSnap.size;
    document.getElementById("stallCount").textContent = stallsSnap.size;
    document.getElementById("todayCount").textContent = getTodayCount();
    document.getElementById("avgGrade").textContent = overallGrade;

    list.innerHTML = "";

    // Show empty state if no centres
    if (centresSnap.empty) {
      list.innerHTML = `<div class="message-box">No food centres available.</div>`;
    }

    // Render each hawker centre card
    centresSnap.forEach(docSnap => {
      const h = docSnap.data();
      const centreId = docSnap.id;
      const stallTotal = stallCounts[centreId] || 0;
      const gradeData = gradeTotals[centreId];
      
      // Calculate average grade for this centre
      const avgGrade = gradeData && gradeData.count
        ? gradeData.sum / gradeData.count
        : 0;
      const gradeLetter = avgGrade >= 3.5 ? "A" : avgGrade >= 2.5 ? "B" : avgGrade >= 1.5 ? "C" : avgGrade > 0 ? "D" : "-";
      const gradeClass = gradeLetter !== "-" ? `grade-${gradeLetter.toLowerCase()}` : "";
      const imageUrl = normalizeImageUrl(h.imageUrl);
      
      // Build location list from stalls
      const locationList = Array.from(stallLocationsByCentre[centreId] || []).sort();
      const address = locationList.length
        ? locationList.join(", ")
        : "Locations unavailable";

      // Render centre card HTML
      list.innerHTML += `
        <div class="centre-card" data-centre-id="${centreId}" data-centre-name="${h.name}">
          <div class="centre-image">
            <img src="${imageUrl}" alt="${h.name}" onerror="this.onerror=null;this.src='${fallbackImage}';">
            <div class="grade-badge ${gradeClass}">${gradeLetter}</div>
          </div>
          <div class="centre-info">
            <div class="centre-title">${h.name}</div>
            <div class="meta-line">
              <i class="fas fa-location-dot"></i>
              ${h.area || "Area unavailable"}
            </div>
            <div class="address">${address}</div>
            <div class="divider"></div>
            <div class="card-bottom">
              <div class="last-inspection">
                Last Inspection
                <strong>${h.lastInspectedAt ? "Last inspected: recently" : "Last inspected: N/A"}</strong>
              </div>
              <div class="stall-info">
                Total Stalls
                <strong>${stallTotal || "-"}</strong>
              </div>
            </div>
          </div>
        </div>
      `;
    });

    // Add click handlers to centre cards
    document.querySelectorAll(".centre-card").forEach(card => {
      card.addEventListener("click", () => {
        localStorage.setItem(
          "selectedHawkerCentreId",
          card.dataset.centreId
        );

        localStorage.setItem(
          "selectedHawkerCentreName",
          card.dataset.centreName
        );

        window.location.href = "inspection.html";
      });
    });

    // Navigation button handlers
    document.getElementById("calendarBtn").addEventListener("click", () => {
      window.location.href = "calendar.html";
    });

    document.getElementById("historyBtn").addEventListener("click", () => {
      window.location.href = "history.html";
    });

    document.getElementById("todayCard").addEventListener("click", () => {
      window.location.href = "today.html";
    });

    // Logout handler
    async function handleLogout() {
      await signOut(auth);
      localStorage.clear();
      window.location.href = "/login.html";
    }

    document.getElementById("logoutBtn").addEventListener("click", handleLogout);
    document.getElementById("logoutActionBtn").addEventListener("click", handleLogout);
  </script>
</body>
</html>
