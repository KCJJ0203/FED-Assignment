<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inspection History</title>

  <!-- Font Awesome for icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    /* CSS Variable Definitions for consistent theming */
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    :root {
      --green-900: #046a51;
      --green-800: #057a5f;
      --green-700: #06886b;
      --page-bg: #f5f9f7;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    /* Global reset and base font */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", Arial, sans-serif;
    }

    /* Body background and text color */
    body {
      background: var(--page-bg);
      color: var(--text-dark);
      min-height: 100vh;
    }

    /* Header section styling */
    .header {
      background: #007e63;
      color: #fff;
      padding: 26px 40px 36px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
    }

    /* Back navigation link */
    .back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 16px;
      color: #fff;
      text-decoration: none;
    }

    /* Header title styling */
    .header h1 {
      font-size: 32px;
      margin-bottom: 6px;
    }

    /* Header description text */
    .header p {
      font-size: 15px;
      opacity: 0.9;
    }

    /* Summary statistics grid */
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    /* Individual summary card */
    .summary-card {
      border-radius: 16px;
      padding: 18px;
      display: grid;
      gap: 8px;
      color: #fff;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    /* Summary card label text */
    .summary-card span {
      font-size: 14px;
      opacity: 0.9;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    /* Summary card value */
    .summary-card strong {
      font-size: 32px;
      font-weight: 700;
    }

    /* Color coding for different summary card types */
    .summary-card.total { background: #2f855a; }
    .summary-card.grade-a { background: #059669; }
    .summary-card.grade-b { background: #0e7490; }
    .summary-card.grade-c { background: #65a30d; }
    .summary-card.avg { background: #14b8a6; }

    /* Main content area */
    .content {
      padding: 28px 40px 48px;
    }

    /* Filter controls container */
    .filters {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      gap: 16px;
      align-items: center;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      margin-bottom: 20px;
      border: 1px solid #e8eef2;
    }

    /* Search input container */
    .search {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-muted);
    }

    /* Search input field */
    .search input {
      border: none;
      flex: 1;
      font-size: 15px;
      outline: none;
      background: transparent;
    }

    /* Grade filter dropdown */
    .grade-filter {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      background: #f8fafc;
      color: var(--text-dark);
      min-width: 160px;
    }

    /* Individual history record card */
    .history-card {
      background: #fff;
      border: 1px solid #e8eef2;
      border-radius: 18px;
      padding: 18px;
      display: grid;
      grid-template-columns: 180px 110px 1fr 140px 90px 140px;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06);
    }

    /* Hawker centre image */
    .history-image {
      width: 100%;
      height: 120px;
      border-radius: 14px;
      object-fit: cover;
    }

    /* Date display pill */
    .date-pill {
      background: #dcfce7;
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      display: grid;
      gap: 4px;
      color: #047857;
      font-weight: 700;
    }

    /* Day number in date pill */
    .date-pill strong {
      font-size: 24px;
    }

    /* Stall title in history card */
    .history-title {
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 18px;
    }

    /* Metadata (location, time, inspector) */
    .history-meta {
      color: var(--text-muted);
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Score display box */
    .score-box {
      background: #f8fafc;
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      display: grid;
      gap: 6px;
      border: 1px solid #e2e8f0;
    }

    /* Score value */
    .score-box strong {
      font-size: 22px;
      color: #047857;
    }

    /* Grade badge display */
    .grade-badge {
      width: 70px;
      height: 70px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 22px;
      border: 2px solid #d1fae5;
      background: #ecfdf5;
      color: #047857;
    }

    /* Grade B badge styling */
    .grade-b { background: #fff7ed; color: #b45309; border-color: #fde68a; }
    
    /* Grade C badge styling */
    .grade-c { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
    
    /* Grade D badge styling */
    .grade-d { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }

    /* View report button */
    .grade-b { background: #fff7ed; color: #b45309; border-color: #fde68a; }
    .grade-c { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
    .grade-d { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }

    .view-btn {
      border: none;
      background: #059669;
      color: #fff;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      justify-content: center;
    }

    /* Empty state message */
    .empty-state {
      background: #fff;
      border: 1px dashed var(--border);
      padding: 24px;
      border-radius: 16px;
      color: var(--text-muted);
      text-align: center;
    }

    /* Large screen responsive breakpoint */
    @media (max-width: 1200px) {
      .history-card {
        grid-template-columns: 1fr;
        text-align: left;
      }

      .score-box,
      .grade-badge,
      .view-btn {
        justify-self: start;
      }

      .history-image {
        height: 180px;
      }
    }

    /* Mobile responsive breakpoint */
    @media (max-width: 720px) {
      .header {
        padding: 24px 20px 30px;
      }

      .content {
        padding: 24px 20px 36px;
      }

      .filters {
        flex-direction: column;
        align-items: stretch;
      }
    }

    /* Tablet adjustments */
    @media (max-width: 768px) {

  .history-card {
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .summary {
    grid-template-columns: 1fr;
  }

  .filters {
    flex-direction: column;
    align-items: stretch;
  }
}

    /* =========================
   GLOBAL MOBILE STYLES
   ========================= */
@media (max-width: 768px) {

  /* Reduce base font size on mobile */
  body {
    font-size: 14px;
  }

  /* Reduce header padding on mobile */
  .header {
    padding: 20px 16px 28px;
  }

  /* Reduce content padding on mobile */
  .content {
    padding: 20px 16px 32px;
  }

  /* Smaller heading sizes on mobile */
  h1 {
    font-size: 24px !important;
  }

  h2 {
    font-size: 20px !important;
  }

  h3 {
    font-size: 17px !important;
  }

  /* Smaller back button text */
  .back {
    font-size: 14px;
  }

  /* Improve touch targets on mobile */
  button, .card, .stall-card {
    touch-action: manipulation;
  }
}

  </style>
</head>

<body>
  <!-- Header with back button and summary statistics -->
  <div class="header">
    <a class="back" href="index.html">
      <i class="fas fa-chevron-left"></i> Back to Dashboard
    </a>
    <h1>Inspection History</h1>
    <p>Complete record of all inspections performed</p>

    <!-- Summary statistics cards -->
    <div class="summary">
      <div class="summary-card total">
        <span><i class="far fa-file-alt"></i> Total Inspections</span>
        <strong id="totalInspections">0</strong>
      </div>
      <div class="summary-card grade-a">
        <span><i class="fas fa-award"></i> Grade A</span>
        <strong id="gradeACount">0</strong>
      </div>
      <div class="summary-card grade-b">
        <span><i class="fas fa-award"></i> Grade B</span>
        <strong id="gradeBCount">0</strong>
      </div>
      <div class="summary-card grade-c">
        <span><i class="fas fa-award"></i> Grade C</span>
        <strong id="gradeCCount">0</strong>
      </div>
      <div class="summary-card avg">
        <span><i class="fas fa-chart-line"></i> Avg Score</span>
        <strong id="avgScore">0%</strong>
      </div>
    </div>
  </div>

  <!-- Main content area with filters and history list -->
  <div class="content">
    <!-- Filter controls -->
    <div class="filters">
      <!-- Search input -->
  <div class="content">
    <div class="filters">
      <div class="search">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search by stall name, food centre, or stall ID...">
      </div>
      <!-- Grade filter dropdown -->
      <select class="grade-filter" id="gradeFilter">
        <option value="all">All Grades</option>
        <option value="A">Grade A</option>
        <option value="B">Grade B</option>
        <option value="C">Grade C</option>
        <option value="D">Grade D</option>
      </select>
    </div>

    <!-- History list container (populated by JavaScript) -->
    <div id="historyList"></div>
  </div>

  <script type="module">
    // Import Firebase modules
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

    // Firebase configuration
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBc5jOMf7hfbWa_65JFcdAMwSKyxtLSCvs",
      authDomain: "fed-assignment-9c219.firebaseapp.com",
      projectId: "fed-assignment-9c219",
      storageBucket: "fed-assignment-9c219.firebasestorage.app",
      messagingSenderId: "287410844855",
      appId: "1:287410844855:web:8c15e5cbe42c321b1e0932"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Check authentication status and redirect if not logged in
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, user => {
      if (!user) window.location.href = "/login.html";
    });

    // DOM element references
    const historyList = document.getElementById("historyList");
    const searchInput = document.getElementById("searchInput");
    const gradeFilter = document.getElementById("gradeFilter");

    // Load inspection records from localStorage
    function loadInspections() {
      return JSON.parse(localStorage.getItem("neaInspections") || "[]");
    }

    // Update summary statistics based on inspections
    function updateSummary(inspections) {
      const total = inspections.length;
      // Count inspections by grade
    function updateSummary(inspections) {
      const total = inspections.length;
      const gradeCounts = inspections.reduce((acc, entry) => {
        acc[entry.grade] = (acc[entry.grade] || 0) + 1;
        return acc;
      }, {});
      // Calculate average score
      const avg = total
        ? Math.round(inspections.reduce((sum, entry) => sum + (entry.percent || 0), 0) / total)
        : 0;

      // Update summary display
      document.getElementById("totalInspections").textContent = total;
      document.getElementById("gradeACount").textContent = gradeCounts.A || 0;
      document.getElementById("gradeBCount").textContent = gradeCounts.B || 0;
      document.getElementById("gradeCCount").textContent = gradeCounts.C || 0;
      document.getElementById("avgScore").textContent = `${avg}%`;
    }

    // Default fallback image for hawker centres
    const fallbackImage = "../image/default-hawker.jpg";

    // Normalize image URL to proper format
    const fallbackImage = "../image/default-hawker.jpg";

    function normalizeImageUrl(url) {
      if (!url) return fallbackImage;
      if (url.startsWith("http://") || url.startsWith("https://")) return url;
      if (url.startsWith("./") || url.startsWith("../")) return encodeURI(url);
      if (url.startsWith("/image/") || url.startsWith("/images/")) return encodeURI(`..${url}`);
      if (url.startsWith("image/") || url.startsWith("images/")) return encodeURI(`../${url}`);
      if (!url.includes("/")) return encodeURI(`../image/${url}`);
      return encodeURI(url);
    }

    // Resolve the correct image for a hawker centre
    function resolveCentreImage(entry) {
      // Check for direct image URL
      const directImage = entry.centreImage || entry.imageUrl;
      if (directImage) return normalizeImageUrl(directImage);

      // Try to match known centres by name
    function resolveCentreImage(entry) {
      const directImage = entry.centreImage || entry.imageUrl;
      if (directImage) return normalizeImageUrl(directImage);

      const centreName = (entry.centreName || "").toLowerCase();
      if (centreName.includes("maxwell")) {
        return normalizeImageUrl("maxwell.jpg");
      }
      if (centreName.includes("tiong bahru")) {
        return normalizeImageUrl("Tiong-Bahru-Market-Authentic-Hawker-Food-Wet-Market.jpg");
      }
      if (centreName.includes("old airport")) {
        return normalizeImageUrl("oldairportroadfoodcentre2.jpg");
      }

      return fallbackImage;
    }

    // Render the history list with filters applied
    function renderHistory() {
      const term = searchInput.value.trim().toLowerCase();
      const gradeValue = gradeFilter.value;
      
      // Filter inspections based on search and grade
    function renderHistory() {
      const term = searchInput.value.trim().toLowerCase();
      const gradeValue = gradeFilter.value;
      const inspections = loadInspections().filter(entry => {
        const combined = `${entry.stallTitle} ${entry.centreName}`.toLowerCase();
        const matchesSearch = combined.includes(term);
        const matchesGrade = gradeValue === "all" || entry.grade === gradeValue;
        return matchesSearch && matchesGrade;
      });

      updateSummary(inspections);

      // Show empty state if no results
      if (!inspections.length) {
        historyList.innerHTML = `<div class="empty-state">No inspection history yet.</div>`;
        return;
      }

      // Render each inspection as a history card
      historyList.innerHTML = inspections.map(entry => {
        const date = new Date(entry.completedAt);
        const day = date.getDate();
        const month = date.toLocaleDateString("en-SG", { month: "short", year: "numeric" });
        const gradeClass = entry.grade ? `grade-${entry.grade.toLowerCase()}` : "grade-c";
        const imageUrl = resolveCentreImage(entry);

        return `
          <div class="history-card">
            <img class="history-image" src="${imageUrl}" alt="${entry.centreName || "Hawker Centre"}" onerror="this.onerror=null;this.src='${fallbackImage}';">
            <div class="date-pill">
              <strong>${day}</strong>
              <span>${month}</span>
            </div>
            <div>
              <div class="history-title">${entry.stallTitle}</div>
              <div class="history-meta">
                <span><i class="fas fa-map-marker-alt"></i> ${entry.centreName || ""}</span>
                <span><i class="far fa-clock"></i> ${entry.completedTime || ""}</span>
                <span><i class="fas fa-user"></i> ${entry.inspectorId || ""}</span>
              </div>
            </div>
            <div class="score-box">
              <span>Score</span>
              <strong>${entry.score || 0}<span style="font-size:14px; font-weight:600;">/100</span></strong>
              <span>${entry.percent || 0}%</span>
            </div>
            <div class="grade-badge ${gradeClass}">${entry.grade || "-"}</div>
            <button class="view-btn" data-id="${entry.id}">
              <i class="fas fa-eye"></i>
              View Report
            </button>
          </div>
        `;
      }).join("");

      // Add click handlers to view buttons
      document.querySelectorAll(".view-btn").forEach(button => {
        button.addEventListener("click", () => {
          localStorage.setItem("selectedReportId", button.dataset.id);
          window.location.href = "report.html";
        });
      });
    }

    // Re-render when search or filter changes
    searchInput.addEventListener("input", renderHistory);
    gradeFilter.addEventListener("change", renderHistory);
    
    // Initial render
    renderHistory();
  </script>
</body>
</html>

    gradeFilter.addEventListener("change", renderHistory);
    renderHistory();
  </script>
</body>
</html>
