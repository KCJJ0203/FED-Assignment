<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Email Sent</title>

  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    rel="stylesheet"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", Arial, sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(180deg, #1f5cff, #0b2fa8);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page {
      width: 100%;
      max-width: 380px;
      height: 100vh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      text-align: center;
    }

    .back {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 18px;
      cursor: pointer;
    }

    h1 {
      margin-top: 80px;
      font-size: 22px;
      font-weight: 600;
    }

    p {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
      opacity: 0.9;
    }

    .email {
      margin-top: 8px;
      font-weight: 600;
    }

    .btn {
      margin-top: 40px;
      width: 100%;
      padding: 16px;
      border-radius: 30px;
      border: none;
      background: #ffffff;
      color: #1f5cff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .help {
      margin-top: 16px;
      font-size: 13px;
      opacity: 0.9;
    }
    .countdown {
  margin-top: 10px;
  font-size: 13px;
  opacity: 0.85;
}

  </style>
</head>

<body>
  <div class="page">

    <!-- Back -->
    <div class="back" onclick="window.location.href='login.html'">
      <i class="fas fa-chevron-left"></i>
    </div>

    <h1>Reset email sent</h1>

    <p>
      We have sent password reset instructions to
    </p>

    <p class="email" id="emailText"></p>

    <button class="btn" onclick="sendAgain()">SEND AGAIN</button>

    <div class="help">Having problem?</div>
    <div class="countdown" id="countdownText">
  Redirecting to login in 5 seconds...
</div>


  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBc5jOMf7hfbWa_65JFcdAMwSKyxtLSCvs",
      authDomain: "fed-assignment-9c219.firebaseapp.com",
      projectId: "fed-assignment-9c219",
      storageBucket: "fed-assignment-9c219.firebasestorage.app",
      messagingSenderId: "287410844855",
      appId: "1:287410844855:web:8c15e5cbe42c321b1e0932"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const email = localStorage.getItem("resetEmail");
    document.getElementById("emailText").textContent = email;
   window.sendAgain = function () {
  if (!email) {
    alert("Email not found. Please try again.");
    return;
  }

  sendPasswordResetEmail(auth, email)
    .then(() => {
      clearInterval(countdownTimer); // stop countdown
      window.location.href = "login.html";
    })
    .catch(err => alert(err.message));
};

// Auto redirect after 5 seconds
setTimeout(() => {
  window.location.href = "login.html";
}, 5000);
let timeLeft = 5;
const countdownEl = document.getElementById("countdownText");

const countdownTimer = setInterval(() => {
  timeLeft--;
  countdownEl.textContent = `Redirecting to login in ${timeLeft} second${timeLeft !== 1 ? "s" : ""}...`;

  if (timeLeft <= 0) {
    clearInterval(countdownTimer);
    window.location.href = "login.html";
  }
}, 1000);




    
  </script>

</body>
</html>
