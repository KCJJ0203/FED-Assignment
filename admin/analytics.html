<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analytics Dashboard</title>
<link rel="stylesheet" href="../css/design-tokens.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>

<style>
:root {
  --primary:#3b3fc4;
  --card-dark:#0b1633;
  --card-dark-2:#0f1e45;
  --text-light:#c7d2fe;
  --accent-blue:#22d3ee;
  --accent-pink:#c084fc;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",sans-serif;}
body{
  min-height:100vh;
  display:flex;
  color:white;
  position:relative;
  overflow-x:hidden;
  background: linear-gradient(120deg,#3b3fc4,#4361ee,#0f1e45,#3b3fc4);
  background-size: 400% 400%;
  animation: gradientShift 15s ease infinite;
}

.blob{
  position:absolute;
  width:150px; height:150px;
  background: rgba(34,211,238,0.2);
  border-radius:50%;
  animation: float 12s ease-in-out infinite;
}
.blob:nth-child(1){ top:10%; left:75%; animation-delay:0s; }
.blob:nth-child(2){ top:40%; left:15%; animation-delay:4s; }
.blob:nth-child(3){ top:65%; left:80%; animation-delay:8s; }

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(50px);}
}
@keyframes gradientShift{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.sidebar {
  width:240px;
  background: linear-gradient(180deg,#4361ee,#3a0ca3);
  border-radius:0 40px 40px 0;
  padding:24px 16px;
  display:flex;
  flex-direction:column;
}
.sidebar h2 { margin-bottom:20px; font-size:20px; }
.sidebar .search { background: rgba(0,0,0,0.3); padding:8px 12px; border-radius:10px; margin-bottom:20px; }
.sidebar input { background:transparent; border:none; outline:none; color:white; width:100%; }
.menu a { display:block; padding:12px; margin-bottom:10px; border-radius:10px; color:#e0e7ff; text-decoration:none; font-size:14px; transition:all 0.3s ease; }
.menu a.active, .menu a:hover { background: rgba(0,0,0,0.25); transform: translateX(5px); }
.profile { margin-top:auto; display:flex; align-items:center; gap:10px; font-size:13px; }
.avatar { width:34px; height:34px; background:#22d3ee; border-radius:50%; }

.main { flex:1; padding:24px 30px; }
.topbar { display:flex; align-items:center; gap:20px; margin-bottom:30px; }
.topbar h1 { font-size:20px; }
.top-search { background:white; padding:8px 14px; border-radius:20px; width:240px; }
.top-search input { border:none; outline:none; width:100%; }

.grid {
  display:grid;
  grid-template-columns: repeat(3,1fr);
  gap:24px;
}
@media(max-width:1000px){.grid{grid-template-columns:1fr;}}

.card {
  background: linear-gradient(180deg,var(--card-dark),var(--card-dark-2));
  border-radius:18px;
  padding:20px;
  box-shadow:0 20px 40px rgba(0,0,0,0.3);
  display:flex;
  flex-direction:column;
  height:350px;
  transform: translateY(50px);
  opacity:0;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.card:hover {
  transform: translateY(-5px);
  box-shadow:0 25px 50px rgba(0,0,0,0.6),0 0 25px rgba(34,211,238,0.6);
}
.card.show { transform:translateY(0); opacity:1; transition: all 0.6s ease; }

.card h3 { font-size:16px; color:var(--text-light); margin-bottom:12px; }
.big { grid-column: span 2; }
canvas { flex:1; }

.btn {
  background:#1e293b; color:#e5e7eb; border:none; padding:4px 10px;
  border-radius:8px; font-size:12px; cursor:pointer; margin-left:6px;
}
.btn:hover{ background: rgba(219,39,119,0.4); }
</style>
</head>

<body>

<div class="blob"></div>
<div class="blob"></div>
<div class="blob"></div>

<aside class="sidebar">
  <h2>Analytics</h2>
  <div class="search"><input placeholder="Search for..." aria-label="Search analytics menu" /></div>
  <nav class="menu">
    <a href="home.html">Home</a>
    <a class="active" href="analytics.html">Analytics</a>
    <a href="report.html">Report</a>
  </nav>
  <div class="profile"><div class="avatar"></div>John Carter</div>
</aside>

<main class="main">
  <div class="topbar">
    <h1>Analytics Page</h1>
    <div class="top-search"><input placeholder="Search anything here..." aria-label="Search analytics content" /></div>
  </div>

  <section class="grid">
    <div class="card big">
      <h3>Overall Hawker Sales
        <button class="btn" type="button" data-range="monthly">Monthly</button>
        <button class="btn" type="button" data-range="quarterly">Quarterly</button>
        <button class="btn" type="button" data-range="yearly">Yearly</button>
      </h3>
      <canvas id="hawkerLine"></canvas>
    </div>

    <div class="card">
      <h3>Customer Satisfaction</h3>
      <canvas id="satisfactionChart"></canvas>
    </div>

    <div class="card">
      <h3>Sales by Stall</h3>
      <canvas id="stallBar"></canvas>
    </div>
  </section>
</main>

<script>
window.addEventListener('load', ()=>{
  document.querySelectorAll('.card').forEach((card,i)=>{
    setTimeout(()=>{card.classList.add('show');}, i*200);
  });
});

const hawkerCtx = document.getElementById('hawkerLine');
const hawkerChart = new Chart(hawkerCtx, {
  type:'line',
  data:{
    labels:['Jan','Feb','Mar','Apr','May','Jun'],
    datasets:[{
      label:'Sales',
      data:[120,150,140,180,170,200],
      borderColor:'#22d3ee',
      backgroundColor:'rgba(34,211,238,0.25)',
      fill:true,
      tension:0.4,
      pointHoverRadius:8,
      pointHoverBackgroundColor:'#22d3ee'
    }]
  },
  options:{
    plugins:{ legend:{display:true, labels:{color:'white'}} },
    scales:{ y:{ ticks:{color:'white'}}, x:{ticks:{color:'white'}} },
    interaction:{ mode:'nearest', axis:'x', intersect:false }
  }
});

function setRange(type){
  const ranges={monthly:[120,150,140,180,170,200], quarterly:[400,450,500,600], yearly:[1500,1600,1700,1800,1900]};
  hawkerChart.data.labels = type==='monthly'?['Jan','Feb','Mar','Apr','May','Jun']:
                             type==='quarterly'?['Q1','Q2','Q3','Q4']:
                             ['2020','2021','2022','2023','2024'];
  hawkerChart.data.datasets[0].data = ranges[type];
  hawkerChart.update();
}

document.querySelectorAll('[data-range]').forEach((button) => {
  button.addEventListener('click', () => {
    setRange(button.dataset.range);
  });
});

new Chart(document.getElementById('satisfactionChart'),{
  type:'doughnut',
  data:{ labels:['Satisfied','Neutral','Unsatisfied'], datasets:[{data:[65,20,15], backgroundColor:['#22d3ee','#3b82f6','#c084fc'], hoverOffset:10}] },
  options:{ plugins:{legend:{position:'bottom', labels:{color:'white'}}} }
});

new Chart(document.getElementById('stallBar'),{
  type:'bar',
  data:{ labels:['Stall A','Stall B','Stall C','Stall D'], datasets:[{label:'Sales', data:[200,250,180,220], backgroundColor:'#22d3ee', hoverBackgroundColor:'#3b82f6'}] },
  options:{
    plugins:{ legend:{display:true, labels:{color:'white'}}, tooltip:{enabled:true}, datalabels:{color:'white', anchor:'end', align:'end', font:{weight:'bold'}} },
    scales:{ y:{ ticks:{color:'white', beginAtZero:true} }, x:{ ticks:{color:'white'} } },
    interaction:{ mode:'nearest', axis:'x', intersect:false }
  },
  plugins:[ChartDataLabels]
});
</script>
</body>
</html>
