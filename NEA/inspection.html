function updateScheduleLocations(stallLocation) {
  if (!scheduleDate.value) return;
  const schedules = loadSchedules();
  const scheduleEntry = schedules.find(item => item.centreId === centreId);
  if (!scheduleEntry) return;

  if (!scheduleEntry.locations) scheduleEntry.locations = {};

  }

  saveSchedules(schedules);
}

function updateScheduleStalls(stallId, stallLocation) {
  if (!scheduleDate.value) return;
  const schedules = loadSchedules();
  const scheduleEntry = schedules.find(item => item.centreId === centreId);
  if (!scheduleEntry) return;

    scheduleEntry.scheduledStalls[scheduleDate.value] = [];

    .some(item => item.stallId === stallId);

    scheduleEntry.scheduledStalls[scheduleDate.value].push({
      stallId,
      centreId,
      location: stallLocation
    });
  }

  saveSchedules(schedules);
}

    entry.time = scheduleTime.value;
    if (!entry.scheduledStalls[scheduleDate.value]) {
      entry.scheduledStalls[scheduleDate.value] = [];
    }
  const gradeClass =
    d.grade === "A" ? "grade-a" :
    d.grade === "B" ? "grade-b" :
    d.grade === "C" ? "grade-c" : "grade-d";

  stallList.innerHTML += `
    <div class="card" data-id="${docSnap.id}">
      <div class="card-top">
        <div class="stall-number">${d.location || "#"}</div>
        <div class="grade-pill ${gradeClass}">Grade ${d.grade || "-"}</div>
      </div>
      <h3>${d.hawkerName || d.name || "Stall"}</h3>
      <div class="desc">${d.category || d.hours || ""}</div>
      <div class="last">Last Inspection
        <strong>${d.lastInspectedAt ? "Last inspected: recently" : "Last inspected: N/A"}</strong>
      </div>
    d.grade === "A" ? "a" :
    d.grade === "B" ? "b" : "c";

    saveSchedules(schedules);
    updateScheduleBar();
  }

  function updateScheduleBar() {
    if (!scheduleDate.value || !scheduleTime.value) {
      scheduledBar.textContent = "Scheduled for: Not set";
      return;
    }

    const d = new Date(`${scheduleDate.value}T${scheduleTime.value}`);
    scheduledBar.textContent =
      `Scheduled for: ${d.toLocaleDateString("en-SG", {
        day: "numeric", month: "short", year: "numeric"
      })} at ${scheduleTime.value}`;
  }

  scheduleDate.addEventListener("change", saveSchedule);
  scheduleTime.addEventListener("change", saveSchedule);

  const centreSnap = await getDoc(doc(db, "hawkers", centreId));
  document.getElementById("centreName").textContent = centreSnap.data().name;

  const q = query(collection(db, "stalls"), where("hawkerId", "==", centreId));
  const snap = await getDocs(q);
  const stallList = document.getElementById("stallList");
  stallList.innerHTML = "";

  snap.forEach(docSnap => {
    const d = docSnap.data();
    stallList.innerHTML += `
      <div class="card" data-id="${docSnap.id}">
        <h3>${d.name}</h3>
        <div class="stall-number">${d.location || ""}</div>
      </div>`;
  });

  document.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => {
      saveSchedule();
      const schedules = loadSchedules();
      const entry = schedules.find(s => s.centreId === centreId);

      const dateKey = scheduleDate.value;
      if (!entry.scheduledStalls[dateKey]) {
        entry.scheduledStalls[dateKey] = [];
      }

      entry.scheduledStalls[dateKey].push({
        stallId: card.dataset.id,
        centreId,
        location: card.querySelector(".stall-number")?.textContent || ""
      });

      saveSchedules(schedules);

      localStorage.setItem("selectedCalendarDate", dateKey);
      localStorage.setItem("selectedCalendarStallId", card.dataset.id);
      window.location.href = "calendar.html";
    });
stallCountEl.textContent = count;
stallCountEl.textContent = `${count} Stall${count !== 1 ? "s" : ""}`;

// ---- Click stall ----
document.querySelectorAll(".card").forEach(card => {
  card.addEventListener("click", () => {
    if (!scheduleDate.value || !scheduleTime.value) {
      alert("Please select a date and time before scheduling.");
      return;
    }

    const stallLocation = card.querySelector(".stall-number")?.textContent?.trim() || "";

    saveSchedule();
    updateScheduleLocations(stallLocation);
    updateScheduleStalls(card.dataset.id, stallLocation);

    localStorage.setItem("selectedCalendarDate", scheduleDate.value || "");
    window.location.href = "calendar.html";
    localStorage.setItem("selectedStallId", card.dataset.id);
    window.location.href = "inspect-stall.html";
  });
</script>

  
</body>
