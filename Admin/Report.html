<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor & Hygiene Reports</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>

:root {
  --primary: #3b3fc4;
  --card-dark: #0b1633;
  --card-dark-2: #0f1e45;
  --text-light: #c7d2fe;
  --text-muted: #c7d2fe;
  --accent-blue: #22d3ee;
  --accent-pink: #c084fc;
  --accent: #d946ef;
  --success: #34d399;
  --warning: #facc15;
  --danger: #f87171;
}


* { margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI",sans-serif; }

body { 
  min-height:100vh; 
  display:flex; 
  color:white;
  position: relative;
  overflow-x: hidden;
  background: linear-gradient(120deg,#3b3fc4,#4361ee,#0f1e45,#3b3fc4);
  background-size: 400% 400%;
  animation: gradientShift 15s ease infinite;
}

@keyframes gradientShift {
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}


.sidebar {
  width:240px;
  background:linear-gradient(180deg,#4361ee,#3a0ca3);
  border-radius:0 40px 40px 0;
  padding:24px 16px;
  display:flex;
  flex-direction:column;
  color:white;
  z-index:10;
}
.sidebar h2 { margin-bottom:20px; font-size:18px; }
.sidebar .search { background:rgba(0,0,0,0.3); padding:8px 12px; border-radius:10px; margin-bottom:20px; }
.sidebar input { background:transparent; border:none; outline:none; color:white; width:100%; }

.menu a {
  display:flex;
  align-items:center;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  color:#e0e7ff;
  text-decoration:none;
  font-size:14px;
  transition: all 0.3s ease;
}
.menu a i { margin-right: 10px; width: 16px; }
.menu a.active, .menu a:hover {
  background:rgba(0,0,0,0.25);
  transform: translateX(5px);
}
.profile { margin-top:auto; display:flex; align-items:center; gap:10px; font-size:13px; }
.avatar { width:34px; height:34px; background:var(--accent-blue); border-radius:50%; }


.main { flex:1; padding:24px 30px; z-index:10; overflow-y: auto; height: 100vh; }
.topbar { display:flex; align-items:center; gap:20px; margin-bottom:30px; }
.topbar h1 { font-size:20px; }
.top-search { background:white; padding:8px 14px; border-radius:20px; width:260px; }
.top-search input { border:none; outline:none; width:100%; color: #333; }


.card {
  background: linear-gradient(180deg, var(--card-dark), var(--card-dark-2));
  border-radius: 18px;
  padding: 25px;
  margin-bottom: 30px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.35);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 25px 50px rgba(0,0,0,0.6), 0 0 20px rgba(217, 70, 239, 0.2);
}
.card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }


table { width:100%; border-collapse:collapse; }
th { text-align:left; font-size:12px; color:var(--text-muted); padding-bottom:12px; text-transform: uppercase; }
td { padding:18px 0; border-top:1px solid rgba(255,255,255,0.08); font-size:14px; }
.owner-email { font-size:12px; color:var(--text-muted); }


.progress-container { width: 100px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-top: 6px; overflow: hidden; }
.progress-bar { height: 100%; border-radius: 10px; transition: width 0.5s ease; }
.grade-pill { padding: 4px 12px; border-radius: 8px; font-weight: bold; font-size: 11px; text-transform: uppercase; }
.bg-a { background: rgba(52, 211, 153, 0.15); color: var(--success); border: 1px solid var(--success); }
.bg-b { background: rgba(250, 204, 21, 0.15); color: var(--warning); border: 1px solid var(--warning); }
.bg-c { background: rgba(248, 113, 113, 0.15); color: var(--danger); border: 1px solid var(--danger); }
.next-audit { font-size: 11px; color: var(--text-muted); display: block; margin-top: 4px; }
.overdue { color: var(--danger); font-weight: bold; }


.status { font-weight:600; }
.completed { color:var(--accent-blue); }
.expired { color:var(--danger); }
.active { color:var(--success); }
.ended { color:var(--warning); }


.modal { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; justify-content:center; align-items:center; z-index: 100; backdrop-filter: blur(5px); }
.modal.show { display:flex; }
.modal-box { background:#081a3b; padding:25px; border-radius:15px; width:380px; border: 1px solid rgba(255,255,255,0.1); }
.modal-box h3 { margin-bottom: 15px; color: var(--accent-blue); }
.modal-box label { font-size: 12px; color: var(--text-muted); margin-top: 10px; display: block; }
.modal-box input, .modal-box select { width:100%; padding:10px; margin-top:5px; border-radius:8px; border:1px solid #1e293b; background:#0f172a; color:white; outline: none; }
.btn-save { background:var(--accent-pink); color:white; border:none; padding:12px; width:100%; margin-top:20px; border-radius:8px; cursor:pointer; font-weight: bold; }


.blob { position:absolute; width:150px; height:150px; background: rgba(34,211,238,0.2); border-radius:50%; animation: float 12s ease-in-out infinite; z-index: 0; }
.blob:nth-child(1) { top:10%; left:75%; animation-delay:0s; }
.blob:nth-child(2) { top:40%; left:15%; animation-delay:4s; }

@keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(50px);} }


tbody tr { transform: translateX(-20px); opacity:0; transition: 0.4s ease; }
tbody tr.show { transform: translateX(0); opacity:1; }
</style>
</head>
<body>

<div class="blob"></div>
<div class="blob"></div>

<aside class="sidebar">
  <h2>Dashboard</h2>
  <div class="search"><input type="text" placeholder="Search menu..." /></div>
  <nav class="menu">
    <a href="Home.html"><i class="fas fa-home"></i> Home</a>
    <a href="Analytics.html"><i class="fas fa-chart-line"></i> Analytics</a>
    <a class="active" href="Report.html"><i class="fas fa-file-alt"></i> Report</a>
  </nav>
  <div class="profile"><div class="avatar"></div>John Carter</div>
</aside>

<main class="main">
  <div class="topbar">
    <h1>Vendor Reports</h1>
    <div class="top-search"><input type="text" id="globalSearch" placeholder="Search stall or owner..." /></div>
  </div>

  <div class="card">
    <div class="card-header">
      <h3>Contract Status</h3>
      <span style="background:var(--accent-pink); padding:4px 12px; border-radius:10px; font-size:12px;">Live Updates</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>Stall owner</th>
          <th>Date</th>
          <th>Status</th>
          <th>Country</th>
          <th>Total</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="card">
    <div class="card-header">
      <h3>Hygiene & Inspection Audit</h3>
      <span style="background:var(--accent-blue); color:#000; padding:4px 12px; border-radius:10px; font-size:12px; font-weight: bold;">Safety First</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>Stall Name</th>
          <th>Health Score</th>
          <th>Hygiene Grade</th>
          <th>Last Inspected</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="hygieneBody"></tbody>
    </table>
  </div>
</main>

<div class="modal" id="editModal">
  <div class="modal-box">
    <h3>Edit Contract</h3>
    <label>Owner Name</label><input id="editOwner">
    <label>Email</label><input id="editEmail">
    <label>Country</label><input id="editCountry">
    <label>Total Amount</label><input id="editTotal">
    <label>Status</label>
    <select id="editStatus">
      <option>Completed</option>
      <option>Expired</option>
      <option>Active</option>
      <option>Ended</option>
    </select>
    <button class="btn-save" onclick="saveEdit()">Update Changes</button>
    <button onclick="closeModal('editModal')" style="background:transparent; border:none; color:var(--text-muted); width:100%; margin-top:10px; cursor:pointer;">Cancel</button>
  </div>
</div>

<div class="modal" id="hygieneModal">
  <div class="modal-box">
    <h3>Edit Hygiene Audit</h3>
    <label>Stall Name</label><input id="hName">
    <label>Health Score (%)</label><input type="number" id="hScore" min="0" max="100">
    <label>Hygiene Grade</label>
    <select id="hGrade">
      <option value="A">Grade A</option>
      <option value="B">Grade B</option>
      <option value="C">Grade C</option>
    </select>
    <label>Last Inspected Date</label><input type="text" id="hDate">
    <label>Next Audit Text</label><input id="hNext" placeholder="e.g. Mar 15 or OVERDUE">
    <button class="btn-save" onclick="saveHygiene()">Update Audit</button>
    <button onclick="closeModal('hygieneModal')" style="background:transparent; border:none; color:var(--text-muted); width:100%; margin-top:10px; cursor:pointer;">Cancel</button>
  </div>
</div>

<script>

let contracts=[
  {owner:"John Carter",email:"contact@johncarter.com",date:"Jan 30, 2024",status:"Completed",country:"Singapore",total:"$1,090.24"},
  {owner:"Sophie Moore",email:"contact@sophiemoore.com",date:"Jan 27, 2024",status:"Expired",country:"Singapore",total:"$870.32"},
  {owner:"Matt Cannon",email:"info@mattcannon.com",date:"Jan 24, 2024",status:"Active",country:"Singapore",total:"$1,899.48"},
  {owner:"Graham Hills",email:"hello@grahamhills.com",date:"Jan 21, 2024",status:"Ended",country:"Singapore",total:"$1,580.12"}
];

let hygieneData=[
  {name:"Grill House", score:92, grade:"A", lastDate:"Feb 05, 2024", next:"Mar 15"},
  {name:"Steak Kitchen", score:74, grade:"B", lastDate:"Jan 20, 2024", next:"Feb 28"},
  {name:"Golden Bistro", score:48, grade:"C", lastDate:"Dec 10, 2023", next:"OVERDUE"}
];

let editIdx = null;
let hygIdx = null;

function renderTable(){
  const tableBody=document.getElementById('tableBody');
  tableBody.innerHTML="";
  contracts.forEach((c,i)=>{
    const row=document.createElement('tr');
    row.innerHTML=`
      <td><strong>${c.owner}</strong><br><span class="owner-email">${c.email}</span></td>
      <td>${c.date}</td>
      <td class="status ${c.status.toLowerCase()}">${c.status}</td>
      <td>${c.country}</td>
      <td>${c.total}</td>
      <td><span onclick="openEdit(${i})" style="cursor:pointer; color:var(--accent-blue)"><i class="fas fa-edit"></i></span></td>
    `;
    tableBody.appendChild(row);
    setTimeout(()=>{row.classList.add('show');}, i*100);
  });
}

function renderHygiene(){
  const hygBody=document.getElementById('hygieneBody');
  hygBody.innerHTML="";
  hygieneData.forEach((h,i)=>{
    const color = h.score >= 80 ? 'var(--success)' : (h.score >= 60 ? 'var(--warning)' : 'var(--danger)');
    const isOverdue = h.next.toLowerCase() === 'overdue';
    const row=document.createElement('tr');
    row.innerHTML=`
      <td><strong>${h.name}</strong><span class="next-audit ${isOverdue?'overdue':''}">Next Audit: ${h.next}</span></td>
      <td>${h.score}% <div class="progress-container"><div class="progress-bar" style="width:${h.score}%; background:${color}"></div></div></td>
      <td><span class="grade-pill bg-${h.grade.toLowerCase()}">Grade ${h.grade}</span></td>
      <td>${h.lastDate}</td>
      <td><span onclick="openHygieneEdit(${i})" style="cursor:pointer; color:var(--accent-blue)"><i class="fas fa-sliders-h"></i></span></td>
    `;
    hygBody.appendChild(row);
    setTimeout(()=>{row.classList.add('show');}, i*100);
  });
}


function openEdit(i){ editIdx=i; const c=contracts[i]; document.getElementById('editOwner').value=c.owner; document.getElementById('editEmail').value=c.email; document.getElementById('editCountry').value=c.country; document.getElementById('editTotal').value=c.total; document.getElementById('editStatus').value=c.status; showModal('editModal'); }
function openHygieneEdit(i){ hygIdx=i; const h=hygieneData[i]; document.getElementById('hName').value=h.name; document.getElementById('hScore').value=h.score; document.getElementById('hGrade').value=h.grade; document.getElementById('hDate').value=h.lastDate; document.getElementById('hNext').value=h.next; showModal('hygieneModal'); }
function saveEdit(){ contracts[editIdx]={...contracts[editIdx], owner: document.getElementById('editOwner').value, email: document.getElementById('editEmail').value, country: document.getElementById('editCountry').value, total: document.getElementById('editTotal').value, status: document.getElementById('editStatus').value }; closeModal('editModal'); renderTable(); }
function saveHygiene(){ hygieneData[hygIdx]={ name: document.getElementById('hName').value, score: parseInt(document.getElementById('hScore').value), grade: document.getElementById('hGrade').value, lastDate: document.getElementById('hDate').value, next: document.getElementById('hNext').value }; closeModal('hygieneModal'); renderHygiene(); }
function showModal(id){ const m = document.getElementById(id); m.style.display='flex'; setTimeout(()=>m.classList.add('show'), 10); }
function closeModal(id){ const m = document.getElementById(id); m.classList.remove('show'); setTimeout(()=>m.style.display='none', 300); }

document.getElementById('globalSearch').addEventListener('input', e=>{
  const query=e.target.value.toLowerCase();
  document.querySelectorAll('tbody tr').forEach(row => {
    const text = row.innerText.toLowerCase();
    row.style.display = text.includes(query) ? '' : 'none';
  });
});

renderTable();
renderHygiene();
</script>
</body>
</html>
