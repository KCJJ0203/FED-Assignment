<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="css/design-tokens.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('image/lau-pa-sat.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            margin: 0;
        }
    </style>
</head>
<body class="login-page">
    <nav aria-label="Primary Navigation" hidden></nav>
    <header class="login-header">
        <a class="back" href="login.html" aria-label="Back">&larr;</a>
        <div class="spacer" aria-hidden="true"></div>
    </header>
    <main class="login">
        <div class="login-box">
            <form class="login-form">
                <h1>Reset Password</h1>
                <p style="color: #c9d2ff; font-size: 13px; margin: 0 0 14px 0; text-align: center;">
                    Enter your email address and we'll send you a link to reset your password.
                </p>
                <label class="field">
                    <span class="sr-only">Email</span>
                    <input type="email" name="email" placeholder="EMAIL" autocomplete="email" required>
                </label>
                <p class="form-error" role="alert" aria-live="polite" hidden></p>
                <button class="login-btn" type="submit">SEND RESET LINK</button>
                <p class="signup">Remember your password? <a href="login.html">Sign in Here</a></p>
            </form>
        </div>
    </main>
    <script src="js/app-firebase.js"></script>
    <script src="js/app-storage.js"></script>
    <script type="module" src="js/forgotpassword.js"></script>
</body>
</html>
