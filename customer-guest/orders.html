<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Guest - Orders</title>
    <link rel="stylesheet" href="../css/customer-guest.css">
</head>
<body>
    <section class="app-shell" aria-label="Guest layout">
        <main class="guest-main">
            <section id="payment-success" class="payment-success is-hidden" aria-label="Payment success">
                <div class="payment-card">
                    <div class="payment-check" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M4 12.5l5 5 11-11"></path>
                        </svg>
                    </div>
                    <h2 class="payment-title">Congratulations!</h2>
                    <p class="payment-text">You successfully made a payment, enjoy our service!</p>
                    <button id="payment-track" class="payment-track" type="button">Track Order</button>
                </div>
            </section>

            <section class="orders-shell" aria-label="Order history">
                <header class="orders-header">
                    <h1 class="guest-title">Your Orders</h1>
                    <p id="orders-status" class="guest-status" role="status" aria-live="polite">Loading orders...</p>
                </header>

                <div id="orders-empty" class="empty-state is-hidden">
                    <h2 class="empty-title">No orders yet</h2>
                    <p class="empty-text">Place an order and it will show up here.</p>
                    <a class="primary-button" href="index.html">Browse stalls</a>
                </div>

                <div id="orders-list" class="orders-list" role="list"></div>
            </section>

            <section id="review-modal" class="review-modal is-hidden" aria-hidden="true">
                <div class="review-backdrop" data-close="true"></div>

                <div class="review-card" role="dialog" aria-modal="true" aria-labelledby="review-title">
                    <div class="review-head">
                        <h2 id="review-title">Leave a Review</h2>
                        <button class="review-x" type="button" id="review-close" aria-label="Close">✕</button>
                    </div>

                    <p class="review-sub" id="review-stall">Stall: -</p>

                    <form id="review-form" class="review-form">
                        <label class="review-label">Title</label>
                        <input id="review-input-title" class="review-input" type="text" required maxlength="60"
                               placeholder="Short title">

                        <label class="review-label">Rating</label>
                        <div class="review-stars" id="review-stars" aria-label="Rating">
                            <button type="button" class="rstar" data-v="1">★</button>
                            <button type="button" class="rstar" data-v="2">★</button>
                            <button type="button" class="rstar" data-v="3">★</button>
                            <button type="button" class="rstar" data-v="4">★</button>
                            <button type="button" class="rstar" data-v="5">★</button>
                        </div>
                        <input type="hidden" id="review-rating" value="0">

                        <label class="review-label">Message</label>
                        <textarea id="review-input-msg" class="review-textarea" required maxlength="500"
                                  placeholder="How was it?"></textarea>

                        <p id="review-error" class="review-error is-hidden" role="alert"></p>

                        <div class="review-actions">
                            <button type="button" class="review-btn outline" id="review-cancel">Cancel</button>
                            <button type="submit" class="review-btn primary">Submit</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>

        <footer class="bottom-nav">
            <nav aria-label="Primary">
                <ul class="nav-list">
                    <li>
                        <a class="nav-link" href="index.html">
                            <span class="nav-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 10.8L12 3l9 7.8"></path>
                                    <path d="M5 9.8v10a1.8 1.8 0 0 0 1.8 1.8h10.4A1.8 1.8 0 0 0 19 19.8v-10"></path>
                                    <path d="M10 21v-6h4v6"></path>
                                </svg>
                            </span>
                            <span class="nav-label">Browse</span>
                        </a>
                    </li>
                    <li>
                        <a class="nav-link" href="cart.html">
                            <span class="nav-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 5h2l2.2 10.4a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6l1.2-6.8H7.2"></path>
                                    <circle cx="10" cy="20" r="1.6"></circle>
                                    <circle cx="18" cy="20" r="1.6"></circle>
                                </svg>
                            </span>
                            <span class="nav-label">Cart</span>
                        </a>
                    </li>
                    <li>
                        <a class="nav-link is-active" href="orders.html" aria-current="page">
                            <span class="nav-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="6" y="4" width="12" height="16" rx="2"></rect>
                                    <path d="M9 3h6"></path>
                                    <path d="M9 10h6"></path>
                                    <path d="M9 14h6"></path>
                                </svg>
                            </span>
                            <span class="nav-label">Orders</span>
                        </a>
                    </li>
                    <li>
                        <a class="nav-link" href="account.html">
                            <span class="nav-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="8" r="3.4"></circle>
                                    <path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path>
                                </svg>
                            </span>
                            <span class="nav-label">Account</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </footer>
    </section>

    <script src="../js/customer-guest-cart-utils.js" defer></script>
    <script src="../js/customer-guest-orders.js" defer></script>
</body>
</html>
