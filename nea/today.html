<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Today's Inspections</title>
  <link rel="stylesheet" href="../css/design-tokens.css">

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>

    :root {
      --green-900: #046a51;
      --green-800: #057a5f;
      --green-700: #06886b;
      --page-bg: #f5f9f7;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", Arial, sans-serif;
    }

    body {
      background: var(--page-bg);
      color: var(--text-dark);
      min-height: 100vh;
    }

    .header {
      background: #007e63;
      color: #fff;
      padding: 26px 40px 36px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      cursor: pointer;
      color: #fff;
      text-decoration: none;
      margin-bottom: 12px;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 15px;
      opacity: 0.9;
    }

    .content {
      padding: 32px 40px 48px;
    }

    .date-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 16px;
      color: var(--text-dark);
      font-size: 15px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
      margin-bottom: 20px;
    }

    .list {
      display: grid;
      gap: 16px;
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.08);
    }

    .card-info {
      display: grid;
      gap: 6px;
    }

    .card-info h3 {
      font-size: 18px;
    }

    .card-info span {
      color: var(--text-muted);
      font-size: 14px;
    }

    .time-pill {
      background: #e8f5e9;
      color: #047857;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }

    .time-pill.completed {
      background: #dcfce7;
      color: #15803d;
    }

    .empty {
      background: #fff;
      border: 1px dashed var(--border);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      color: var(--text-muted);
    }

    @media (max-width: 720px) {
      .header {
        padding: 24px 20px 30px;
      }

      .content {
        padding: 24px 20px 36px;
      }
    }

    @media (max-width: 768px) {
      .list {
        gap: 12px;
      }

      .card {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .time-pill {
        align-self: flex-start;
      }
    }

    @media (max-width: 768px) {

      body {
        font-size: 14px;
      }

      .header {
        padding: 20px 16px 28px;
      }

      .content {
        padding: 20px 16px 32px;
      }

      h1 {
        font-size: 24px !important;
      }

      h2 {
        font-size: 20px !important;
      }

      h3 {
        font-size: 17px !important;
      }

      .back {
        font-size: 14px;
      }

      button, .card, .stall-card {
        touch-action: manipulation;
      }
    }
  </style>
</head>

<body>
  <nav aria-label="NEA Navigation" hidden></nav>
  <main>

  <div class="header">
    <a class="back" href="index.html">
      <i class="fas fa-chevron-left"></i> Back to Dashboard
    </a>
    <h1>Today's Inspections</h1>
    <p>Select an inspection to continue</p>
  </div>

  <div class="content">

    <div class="date-pill">
      <i class="far fa-calendar"></i>
      <span id="todayLabel">Today</span>
    </div>

    <div class="list" id="inspectionList"></div>
  </div>

  <script src="../js/app-firebase.js"></script>
  <script src="../js/app-storage.js"></script>
  <script type="module">
    const { auth, onAuthStateChanged } = await window.AppFirebase.getAuth();
    const storageApi = window.AppStorage || null;
    const storageKeys = storageApi ? storageApi.KEYS : {};
    const STORAGE = {
      schedules: storageKeys.NEA_SCHEDULES || "neaSchedules",
      inspections: storageKeys.NEA_INSPECTIONS || "neaInspections",
      stallId: storageKeys.NEA_SELECTED_STALL_ID || "selectedStallId",
      centreId: storageKeys.NEA_SELECTED_CENTRE_ID || "selectedHawkerCentreId"
    };

    const readLocalJson = (key, fallback) => {
      if (storageApi && typeof storageApi.readJSON === "function") {
        return storageApi.readJSON(localStorage, key, fallback);
      }
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (error) {
        return fallback;
      }
    };

    onAuthStateChanged(auth, user => {
      if (!user) window.location.href = "../login.html";
    });

    
    const list = document.getElementById("inspectionList");

    
    function dateKey(d) {
      return d.toISOString().split("T")[0];
    }

    
    const today = new Date();
    document.getElementById("todayLabel").textContent = today.toLocaleDateString(
      "en-SG",
      { weekday: "long", day: "numeric", month: "long", year: "numeric" }
    );

    
    const todayKey = dateKey(new Date());

    
    const schedules = readLocalJson(STORAGE.schedules, []);
    const inspections = readLocalJson(STORAGE.inspections, []);

    
    const scheduled = schedules.flatMap(entry =>
      (entry.scheduledStalls?.[todayKey] || []).map(item => ({
        ...item,
        centreName: entry.centreName,
        time: entry.time,
        status: "scheduled"
      }))
    );

    
    const completed = inspections.filter(i =>
      i.completedAt && dateKey(new Date(i.completedAt)) === todayKey
    ).map(i => ({
      stallId: i.stallId,
      location: i.stallTitle,
      centreName: i.centreName,
      time: i.completedTime,
      status: "completed"
    }));

    
    const all = [...scheduled, ...completed];

    
    if (!all.length) {
      list.innerHTML = `<div class="empty">No inspections today.</div>`;
    } else {
      list.innerHTML = all.map(item => `
        <div class="card" ${item.status === 'scheduled' ? `data-stall-id="${item.stallId}" data-centre-id="${item.centreId}"` : ''}>
          <div class="card-info">
            <h3>${item.location || item.name || "Stall"}</h3>
            <span>${item.centreName}</span>
          </div>
          <span class="time-pill ${item.status === 'completed' ? 'completed' : ''}">
            ${item.status === "completed" ? "✓ Completed" : item.time}
          </span>
        </div>
      `).join("");

      
      document.querySelectorAll(".card[data-stall-id]").forEach(card => {
        card.addEventListener("click", () => {
          localStorage.setItem(STORAGE.stallId, card.dataset.stallId);
          localStorage.setItem(STORAGE.centreId, card.dataset.centreId);
          window.location.href = "inspect-stall.html";
        });
      });
    }
  </script>
  </main>
</body>
</html>
