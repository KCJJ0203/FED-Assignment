<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inspection Calendar</title>

  <!-- Font Awesome for icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    /* CSS Variable Definitions for consistent theming */
    :root {
      --green-900: #0a5d3c;
      --green-800: #0b7d38;
      --green-700: #0a6a32;
      --page-bg: #f3f6f4;
      --text-dark: #0f172a;
      --text-muted: #6b7280;
      --border: #e2e8f0;
      --completed: #d9fbe7;
      --scheduled: #fff1b8;
      --card-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
    }

    /* Global reset and base font */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", Arial, sans-serif;
    }

    /* Body background and text color */
    body {
      background: var(--page-bg);
      color: var(--text-dark);
      min-height: 100vh;
    }

    /* Header section with gradient background */
    .header {
      background: linear-gradient(90deg, var(--green-800), var(--green-700));
      color: #fff;
      padding: 26px 36px 40px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      box-shadow: var(--card-shadow);
    }

    /* Back navigation link */
    .back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      cursor: pointer;
      color: #fff;
      text-decoration: none;
      margin-bottom: 10px;
    }

    /* Header title styling */
    .header h1 {
      font-size: 30px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    /* Header subtitle/description */
    .header p {
      font-size: 15px;
      opacity: 0.9;
    }

    /* Filter/legend container */
    .filters {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    /* Individual filter item */
    .filter {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    /* Legend dot indicator */
    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 6px;
      background: #fff;
    }

    /* Completed status color */
    .legend-dot.completed { background: var(--completed); }
    
    /* Scheduled status color */
    .legend-dot.scheduled { background: var(--scheduled); }

    /* Main content area */
    .content {
      padding: 30px 36px 50px;
    }

    /* Two-column grid layout for calendar and details */
    .calendar-grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 24px;
      align-items: stretch;
    }

    /* Shared card styling */
    .calendar-card,
    .detail-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      box-shadow: var(--card-shadow);
    }

    /* Calendar card specific layout */
    .calendar-card {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Calendar header with title and controls */
    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* Calendar month/year title */
    .calendar-header h2 {
      color: var(--green-800);
      font-size: 26px;
      font-weight: 700;
    }

    /* Calendar navigation controls */
    .calendar-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* Calendar control buttons */
    .calendar-controls button {
      background: #f1f5f9;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
      color: var(--text-dark);
    }

    /* 7-column grid for calendar days */
    .day-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 12px;
      text-align: center;
    }

    /* Day name headers (Sun, Mon, etc.) */
    .day-name {
      font-weight: 600;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Individual day cell */
    .day {
      padding: 14px 10px;
      border-radius: 16px;
      border: 1px solid var(--border);
      font-weight: 600;
      background: #fff;
      min-height: 82px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    /* Day cell hover effect */
    .day:hover {
      box-shadow: 0 10px 18px rgba(15, 23, 42, 0.08);
      transform: translateY(-1px);
    }

    /* Completed inspection day styling */
    .day.completed {
      background: var(--completed);
      border-color: #22c55e;
    }

    /* Scheduled inspection day styling */
    .day.scheduled {
      background: var(--scheduled);
      border-color: #facc15;
    }

    /* Day with both completed and scheduled inspections */
    .day.completed.scheduled {
      background: linear-gradient(180deg, var(--completed), var(--scheduled));
      border-color: #65a30d;
    }

    /* Day number display */
    .day-number {
      font-size: 16px;
      font-weight: 700;
      line-height: 1;
    }

    /* Labels showing inspection counts and locations */
    .day-labels {
      display: grid;
      gap: 2px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      text-align: center;
      width: 100%;
      line-height: 1.2;
    }

    /* Detail panel for selected date */
    .detail-card {
      display: flex;
      flex-direction: column;
      gap: 14px;
      color: var(--text-muted);
    }

    /* Icon container in detail card */
    .detail-card .icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #f1f5f9;
      display: grid;
      place-items: center;
      font-size: 26px;
      color: #94a3b8;
    }

    /* Detail card heading */
    .detail-card h3 {
      color: var(--text-dark);
      font-size: 18px;
      margin-top: 10px;
    }

    /* Empty state styling for detail card */
    .detail-card.empty {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Detail card header with icon and text */
    .detail-header {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    /* Prevent icon from shrinking */
    .detail-header .icon {
      flex-shrink: 0;
    }

    /* Detail header text */
    .detail-header p {
      font-size: 14px;
    }

    /* Section within detail card (e.g., Pending/Completed) */
    .detail-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    /* Section heading */
    .detail-section h4 {
      color: var(--text-dark);
      font-size: 15px;
    }

    /* Individual inspection item in detail view */
    .inspection-item {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #fff;
    }

    /* Highlighted inspection item */
    .inspection-item.highlight {
      border-color: #16a34a;
      box-shadow: 0 12px 22px rgba(22, 163, 74, 0.12);
    }

    /* Inspection metadata (stall name, centre, time) */
    .inspection-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: var(--text-muted);
      font-size: 13px;
      text-align: left;
    }

    /* Bold stall name in metadata */
    .inspection-meta strong {
      color: var(--text-dark);
      font-size: 15px;
    }

    /* Action buttons (Start/View) */
    .action-btn {
      border: none;
      border-radius: 12px;
      padding: 8px 14px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: var(--green-800);
    }

    /* View inspection button variant */
    .action-btn.view {
      background: #0f172a;
    }

    /* Active/selected day styling */
    .day.active {
      outline: 2px solid var(--green-800);
      outline-offset: 2px;
    }

    /* Summary statistics row */
    .summary-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 24px;
    }

    /* Individual summary card */
    .summary-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 120px;
      box-shadow: var(--card-shadow);
    }

    /* Badge icon in summary card */
    .summary-card .badge {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 18px;
      color: var(--green-800);
      background: #e7f8ee;
    }

    /* Summary card label */
    .summary-card h4 {
      font-size: 15px;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Summary card value */
    .summary-card strong {
      font-size: 26px;
      color: var(--text-dark);
      font-weight: 700;
    }

    /* Completed summary card styling */
    .summary-card.completed { border-color: #22c55e; }
    .summary-card.completed .badge { background: #d9fbe7; color: #16a34a; }

    /* Scheduled summary card styling */
    .summary-card.scheduled { border-color: #facc15; }
    .summary-card.scheduled .badge { background: #fff4cc; color: #ca8a04; }

    /* Total summary card styling */
    .summary-card.total { border-color: #94a3b8; }
    .summary-card.total .badge { background: #e2e8f0; color: #475569; }

    /* Tablet responsive breakpoint */
    @media (max-width: 980px) {
      .calendar-grid {
        grid-template-columns: 1fr;
      }

      .summary-row {
        grid-template-columns: 1fr;
      }
    }

    /* Mobile responsive breakpoint */
    @media (max-width: 720px) {
      .header {
        padding: 24px 20px 30px;
      }

      .content {
        padding: 24px 20px 36px;
      }
    }

    /* Additional tablet adjustments */
    @media (max-width: 768px) {

  .calendar-grid {
    grid-template-columns: 1fr;
  }

  .day-grid {
    gap: 6px;
  }

  .day {
    min-height: 64px;
    font-size: 13px;
  }

  .summary-row {
    grid-template-columns: 1fr;
  }
}

    /* =========================
   GLOBAL MOBILE STYLES
   ========================= */
@media (max-width: 768px) {

  /* Reduce base font size on mobile */
  body {
    font-size: 14px;
  }

  /* Reduce header padding on mobile */
  .header {
    padding: 20px 16px 28px;
  }

  /* Reduce content padding on mobile */
  .content {
    padding: 20px 16px 32px;
  }

  /* Smaller heading sizes on mobile */
  h1 {
    font-size: 24px !important;
  }

  h2 {
    font-size: 20px !important;
  }

  h3 {
    font-size: 17px !important;
  }

  /* Smaller back button text */
  .back {
    font-size: 14px;
  }

  /* Improve touch targets on mobile */
  button, .card, .stall-card {
    touch-action: manipulation;
  }
}

  </style>
</head>

<body>
  <!-- Header section with navigation and legend -->
  <div class="header">
    <div>
      <!-- Back button to dashboard -->
      <a class="back" href="index.html">
        <i class="fas fa-chevron-left"></i> Back to Dashboard
      </a>
      <h1>Inspection Calendar</h1>
      <p>View completed and scheduled inspections</p>
    </div>
    <!-- Legend showing color coding -->
    <div class="filters">
      <div class="filter">
        <span class="legend-dot completed"></span>
        Completed
      </div>
      <div class="filter">
        <span class="legend-dot scheduled"></span>
        Scheduled
      </div>
    </div>
  </div>

  <!-- Main content area -->
  <div class="content">
    <!-- Calendar and detail panel grid -->
    <div class="calendar-grid">
      <!-- Calendar card -->
      <div class="calendar-card">
        <!-- Calendar header with navigation controls -->
        <div class="calendar-header">
          <h2 id="calendarTitle">Month</h2>
          <div class="calendar-controls">
            <button id="todayBtn">Today</button>
            <button id="prevBtn"><i class="fas fa-chevron-left"></i></button>
            <button id="nextBtn"><i class="fas fa-chevron-right"></i></button>
          </div>
        </div>

        <!-- Calendar day grid (populated by JavaScript) -->
        <div class="day-grid" id="dayGrid"></div>
      </div>

      <!-- Detail card showing inspection details for selected date -->
      <div class="detail-card empty" id="detailCard">
        <div class="icon"><i class="far fa-calendar"></i></div>
        <h3>Select a Date</h3>
        <p>Click on any date to view inspection details</p>
      </div>
    </div>

    <!-- Summary statistics row -->
    <div class="summary-row" id="summaryRow">
      <div class="summary-card completed">
        <div class="badge"><i class="fas fa-check-circle"></i></div>
        <h4>Completed</h4>
        <strong>0</strong>
      </div>
      <div class="summary-card scheduled">
        <div class="badge"><i class="far fa-clock"></i></div>
        <h4>Scheduled</h4>
        <strong>0</strong>
      </div>
      <div class="summary-card total">
        <div class="badge"><i class="far fa-calendar"></i></div>
        <h4>Total</h4>
        <strong>0</strong>
      </div>
    </div>
  </div>

  <script type="module">
    // Import Firebase modules
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

    // Firebase configuration object
    const firebaseConfig = {
      apiKey: "AIzaSyBc5jOMf7hfbWa_65JFcdAMwSKyxtLSCvs",
      authDomain: "fed-assignment-9c219.firebaseapp.com",
      projectId: "fed-assignment-9c219",
      storageBucket: "fed-assignment-9c219.firebasestorage.app",
      messagingSenderId: "287410844855",
      appId: "1:287410844855:web:8c15e5cbe42c321b1e0932"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Check authentication status and redirect if not logged in
    onAuthStateChanged(auth, user => {
      if (!user) window.location.href = "/login.html";
    });

    // DOM element references
    const dayGrid = document.getElementById("dayGrid");
    const calendarTitle = document.getElementById("calendarTitle");
    const todayBtn = document.getElementById("todayBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const summaryRow = document.getElementById("summaryRow");
    const detailCard = document.getElementById("detailCard");

    // Month names for display
    const monthNames = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];

    // Current calendar state
    let currentDate = new Date();
    let selectedDateKey = "";

    // Load inspection records from localStorage
    function loadInspections() {
      return JSON.parse(localStorage.getItem("neaInspections") || "[]");
    }

    // Load schedule records from localStorage
    function loadSchedules() {
      return JSON.parse(localStorage.getItem("neaSchedules") || "[]");
    }

    // Normalize date values to YYYY-MM-DD format
    function normalizeDateKey(value) {
      if (!value) return "";
      // Already in correct format
      if (typeof value === "string" && /^\d{4}-\d{2}-\d{2}$/.test(value)) {
        return value;
      }
      // Parse and convert to UTC date string
      const parsed = new Date(value);
      if (Number.isNaN(parsed.getTime())) return "";
      return new Date(Date.UTC(
        parsed.getFullYear(),
        parsed.getMonth(),
        parsed.getDate()
      )).toISOString().split("T")[0];
    }

    // Build a map of completed inspections by date
    function buildCompletedMap() {
      const completedByDate = {};

      loadInspections().forEach(entry => {
        const dateKey = normalizeDateKey(entry.scheduleDate || entry.completedAt);
        if (!dateKey) return;
        // Track which stalls have been completed on each date
        if (!completedByDate[dateKey]) completedByDate[dateKey] = new Set();
        if (entry.stallId) completedByDate[dateKey].add(entry.stallId);
      });

      return completedByDate;
    }

    // Build maps of completed and scheduled inspections for a specific month
    function buildDayMap(year, month) {
      const completed = {};
      const scheduled = {};
      const completedByDate = buildCompletedMap();

      // Count completed inspections by day of month
      loadInspections().forEach(entry => {
        const dateKey = normalizeDateKey(entry.scheduleDate || entry.completedAt);
        if (!dateKey) return;
        const date = new Date(`${dateKey}T00:00:00`);
        if (date.getFullYear() === year && date.getMonth() === month) {
          const key = date.getDate();
          completed[key] = (completed[key] || 0) + 1;
        }
      });

      // Count scheduled (pending) inspections by day of month
      loadSchedules().forEach(entry => {
        if (!entry.date) return;
        const date = new Date(entry.date);
        if (date.getFullYear() !== year || date.getMonth() !== month) {
          return;
        }
        const dayKey = date.getDate();
        const dateKey = normalizeDateKey(entry.date);
        const completedSet = completedByDate[dateKey] || new Set();
        const scheduleItems = entry.scheduledStalls?.[dateKey] || [];
        // Filter out already completed stalls
        const pendingItems = scheduleItems.filter(item => !completedSet.has(item.stallId));
        const fallbackLocations = entry.locations?.[dateKey] || [];
        // Count pending inspections
        const pendingCount = scheduleItems.length
          ? pendingItems.length
          : fallbackLocations.length || 0;
        if (pendingCount) {
          scheduled[dayKey] = (scheduled[dayKey] || 0) + pendingCount;
        }
      });

      return { completed, scheduled, completedByDate };
    }

    // Format date key into readable heading
    function formatDateHeading(dateKey) {
      const parsed = new Date(`${dateKey}T00:00:00`);
      if (Number.isNaN(parsed.getTime())) return "Inspection Details";
      return parsed.toLocaleDateString("en-SG", {
        day: "numeric",
        month: "long",
        year: "numeric"
      });
    }

    // Get all scheduled items for a specific date
    function getScheduleItemsForDate(dateKey) {
      const schedules = loadSchedules();
      return schedules.flatMap(entry => {
        const items = entry.scheduledStalls?.[dateKey] || [];
        if (items.length) {
          // Return scheduled stall items with metadata
          return items.map(item => ({
            ...item,
            time: entry.time,
            centreName: entry.centreName || "",
            dateKey
          }));
        }
        // Fallback to location strings if no stall items
        const locations = entry.locations?.[dateKey] || [];
        return locations.map(location => ({
          location,
          time: entry.time,
          centreName: entry.centreName || "",
          dateKey
        }));
      });
    }

    // Get all completed inspections for a specific date
    function getCompletedInspectionsForDate(dateKey) {
      return loadInspections().filter(entry => (
        normalizeDateKey(entry.scheduleDate || entry.completedAt) === dateKey
      ));
    }

    // Render the detail panel for a selected date
    function renderDetail(dateKey, highlightedStallId = "") {
      // Show empty state if no date selected
      if (!dateKey) {
        detailCard.classList.add("empty");
        detailCard.innerHTML = `
          <div class="icon"><i class="far fa-calendar"></i></div>
          <h3>Select a Date</h3>
          <p>Click on any date to view inspection details</p>
        `;
        return;
      }

      // Get completed and scheduled items for this date
      const completedByDate = buildCompletedMap();
      const completedSet = completedByDate[dateKey] || new Set();
      const scheduleItems = getScheduleItemsForDate(dateKey);
      // Filter out stalls that have already been inspected
      const pendingItems = scheduleItems.filter(item => (
        !item.stallId || !completedSet.has(item.stallId)
      ));
      const completedItems = getCompletedInspectionsForDate(dateKey);

      // Build pending inspections list HTML
      const pendingList = pendingItems.length
        ? pendingItems.map(item => `
            <div class="inspection-item ${item.stallId === highlightedStallId ? "highlight" : ""}">
              <div class="inspection-meta">
                <strong>${item.name || item.location || "Scheduled Stall"}</strong>
                <span>${item.centreName || "Hawker Centre"}</span>
                <span>${item.time || "Time pending"}</span>
              </div>
              ${item.stallId ? `
                <button class="action-btn start" data-stall-id="${item.stallId}" data-centre-id="${item.centreId || ""}" data-time="${item.time || ""}">Start inspection</button>
              ` : ""}
            </div>
          `).join("")
        : `<p>No scheduled inspections.</p>`;

      // Build completed inspections list HTML
      const completedList = completedItems.length
        ? completedItems.map(item => `
            <div class="inspection-item">
              <div class="inspection-meta">
                <strong>${item.stallTitle || "Completed Stall"}</strong>
                <span>${item.centreName || "Hawker Centre"}</span>
                <span>${item.completedTime || item.scheduleTime || ""}</span>
              </div>
              <button class="action-btn view" data-report-id="${item.id}">View inspection</button>
            </div>
          `).join("")
        : `<p>No completed inspections.</p>`;

      // Render detail card with both pending and completed sections
      detailCard.classList.remove("empty");
      detailCard.innerHTML = `
        <div class="detail-header">
          <div class="icon"><i class="far fa-calendar-check"></i></div>
          <div>
            <h3>${formatDateHeading(dateKey)}</h3>
            <p>${pendingItems.length} scheduled · ${completedItems.length} completed</p>
          </div>
        </div>
        <div class="detail-section">
          <h4>Pending Inspections</h4>
          ${pendingList}
        </div>
        <div class="detail-section">
          <h4>Completed Inspections</h4>
          ${completedList}
        </div>
      `;

      // Add click handlers for "Start inspection" buttons
      detailCard.querySelectorAll(".action-btn.start").forEach(button => {
        button.addEventListener("click", () => {
          localStorage.setItem("selectedStallId", button.dataset.stallId);
          if (button.dataset.centreId) {
            localStorage.setItem("selectedHawkerCentreId", button.dataset.centreId);
          }
          localStorage.setItem("scheduleDate", dateKey);
          if (button.dataset.time) {
            localStorage.setItem("scheduleTime", button.dataset.time);
          }
          window.location.href = "inspect-stall.html";
        });
      });

      // Add click handlers for "View inspection" buttons
      detailCard.querySelectorAll(".action-btn.view").forEach(button => {
        button.addEventListener("click", () => {
          localStorage.setItem("selectedReportId", button.dataset.reportId);
          window.location.href = "report.html";
        });
      });
    }

    // Render the summary statistics for the current month
    function renderSummary(month, year) {
      const inspections = loadInspections();
      const schedules = loadSchedules();
      const completedByDate = buildCompletedMap();

      // Count completed inspections in current month
      const completedCount = inspections.filter(entry => {
        const date = new Date(entry.completedAt);
        return date.getFullYear() === year && date.getMonth() === month;
      }).length;

      // Count scheduled (pending) inspections in current month
      const scheduledCount = schedules.reduce((total, entry) => {
        if (!entry.date) return total;
        const date = new Date(entry.date);
        if (date.getFullYear() !== year || date.getMonth() !== month) {
          return total;
        }
        const dateKey = normalizeDateKey(entry.date);
        const completedSet = completedByDate[dateKey] || new Set();
        const scheduleItems = entry.scheduledStalls?.[dateKey] || [];
        const pendingItems = scheduleItems.filter(item => !completedSet.has(item.stallId));
        const fallbackLocations = entry.locations?.[dateKey] || [];
        return total + (scheduleItems.length
          ? pendingItems.length
          : (fallbackLocations.length || 0));
      }, 0);

      const total = completedCount + scheduledCount;

      // Render summary cards with counts
      summaryRow.innerHTML = `
        <div class="summary-card completed">
          <div class="badge"><i class="fas fa-check-circle"></i></div>
          <h4>Completed</h4>
          <strong>${completedCount}</strong>
        </div>
        <div class="summary-card scheduled">
          <div class="badge"><i class="far fa-clock"></i></div>
          <h4>Scheduled</h4>
          <strong>${scheduledCount}</strong>
        </div>
        <div class="summary-card total">
          <div class="badge"><i class="far fa-calendar"></i></div>
          <h4>Total</h4>
          <strong>${total}</strong>
        </div>
      `;
    }

    // Render the calendar grid for the given date
    function renderCalendar(date) {
      const year = date.getFullYear();
      const month = date.getMonth();
      calendarTitle.textContent = `${monthNames[month]} ${year}`;

      // Calculate calendar layout
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const { completed, scheduled, completedByDate } = buildDayMap(year, month);
      const schedules = loadSchedules();

      // Render day name headers
      const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      dayGrid.innerHTML = dayNames.map(day => `<div class="day-name">${day}</div>`).join("");

      // Add empty cells for days before the 1st of the month
      for (let i = 0; i < firstDay; i += 1) {
        dayGrid.innerHTML += `<div></div>`;
      }

      // Render each day of the month
      for (let day = 1; day <= daysInMonth; day += 1) {
        const isCompleted = Boolean(completed[day]);
        const isScheduled = Boolean(scheduled[day]);
        const targetDate = new Date(year, month, day);
        targetDate.setHours(0, 0, 0, 0);
        
        // Build CSS classes based on inspection status
        const classes = ["day"];
        if (isCompleted) classes.push("completed");
        if (isScheduled) classes.push("scheduled");
        const dateKey = new Date(Date.UTC(year, month, day)).toISOString().split("T")[0];
        if (selectedDateKey === dateKey) classes.push("active");

        // Build label showing inspection counts
        let label = "";
        if (isCompleted && isScheduled) {
          label = `${completed[day]} done · ${scheduled[day]} scheduled`;
        } else if (isCompleted) {
          label = `${completed[day]} done`;
        } else if (isScheduled) {
          label = `${scheduled[day]} scheduled`;
        }

        // Get scheduled items and locations for this day
        const scheduleItems = schedules
          .flatMap(entry => entry.scheduledStalls?.[dateKey] || [])
          .filter(Boolean);
        const completedSet = completedByDate[dateKey] || new Set();
        const pendingItems = scheduleItems.filter(item => !completedSet.has(item.stallId));
        const locations = scheduleItems.length
          ? pendingItems.map(item => item.location).filter(Boolean)
          : schedules.flatMap(entry => entry.locations?.[dateKey] || []).filter(Boolean);

        const locationLabel = locations.length ? locations.join(", ") : "";
        const scheduledItem = pendingItems[0];
        // Add data attributes for first pending item
        const dataAttrs = scheduledItem
          ? `data-stall-id="${scheduledItem.stallId}" data-centre-id="${scheduledItem.centreId}"`
          : "";

        // Combine labels
        const labelContent = [label, locationLabel].filter(Boolean).map(text => `<div>${text}</div>`).join("");

        // Render day button
        dayGrid.innerHTML += `
          <button type="button" class="${classes.join(" ")}" data-date="${targetDate.toISOString()}" data-date-key="${dateKey}" ${dataAttrs}>
            <div class="day-number">${day}</div>
            ${labelContent ? `<div class="day-labels">${labelContent}</div>` : ""}
          </button>
        `;
      }

      // Add click handlers to day buttons
      document.querySelectorAll(".day[data-date-key]").forEach(dayButton => {
        const dateKey = dayButton.dataset.dateKey;
        dayButton.addEventListener("click", () => {
          selectedDateKey = dateKey;
          localStorage.setItem("selectedCalendarDate", dateKey);
          // Remove active class from all days
          document.querySelectorAll(".day.active").forEach(btn => btn.classList.remove("active"));
          // Add active class to clicked day
          dayButton.classList.add("active");
          renderDetail(dateKey);
        });
      });

      renderSummary(month, year);
    }

    // Today button: jump to current month
    todayBtn.addEventListener("click", () => {
      currentDate = new Date();
      renderCalendar(currentDate);
    });

    // Previous month button
    prevBtn.addEventListener("click", () => {
      currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1);
      renderCalendar(currentDate);
    });

    // Next month button
    nextBtn.addEventListener("click", () => {
      currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1);
      renderCalendar(currentDate);
    });

    // Initial calendar render
    renderCalendar(currentDate);

    // Restore selected date from localStorage if present
    const selectedCalendarDate = localStorage.getItem("selectedCalendarDate");
    const selectedCalendarStallId = localStorage.getItem("selectedCalendarStallId") || "";
    if (selectedCalendarDate) {
      const parsedDate = new Date(`${selectedCalendarDate}T00:00:00`);
      if (!Number.isNaN(parsedDate.getTime())) {
        currentDate = parsedDate;
        selectedDateKey = selectedCalendarDate;
        renderCalendar(currentDate);
        renderDetail(selectedCalendarDate, selectedCalendarStallId);
      }
      // Clean up localStorage after restoring state
      localStorage.removeItem("selectedCalendarDate");
      localStorage.removeItem("selectedCalendarStallId");
      localStorage.removeItem("selectedCalendarCentreId");
    }
  </script>
</body>
</html>
