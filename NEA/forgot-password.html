<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password</title>

  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    rel="stylesheet"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", Arial, sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(180deg, #1f5cff, #0b2fa8);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page {
      width: 100%;
      max-width: 380px;
      height: 100vh;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .back {
      font-size: 18px;
      cursor: pointer;
    }

    .header {
      margin-top: 40px;
      text-align: center;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
      line-height: 1.4;
    }

    .form {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .input-group {
      position: relative;
    }

    .input-group i {
      position: absolute;
      top: 50%;
      left: 16px;
      transform: translateY(-50%);
      opacity: 0.8;
    }

    .input-group input {
      width: 100%;
      padding: 16px 48px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.4);
      background: transparent;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    .input-group input::placeholder {
      color: rgba(255,255,255,0.7);
    }

    .reset-btn {
      padding: 16px;
      border-radius: 30px;
      border: none;
      background: #ffffff;
      color: #1f5cff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- Back -->
    <div class="back" onclick="window.location.href='login.html'">
      <i class="fas fa-chevron-left"></i>
    </div>

    <!-- Header -->
    <div class="header">
      <h1>Forgot password</h1>
      <p>
        Enter your officer email address and we will send you reset instructions.
      </p>
    </div>

    <!-- Form -->
    <div class="form">
      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="email" id="resetEmail" placeholder="officer@nea.gov.sg">
      </div>

      <button class="reset-btn" onclick="resetPassword()">
        RESET PASSWORD
      </button>
    </div>

  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBc5jOMf7hfbWa_65JFcdAMwSKyxtLSCvs",
      authDomain: "fed-assignment-9c219.firebaseapp.com",
      projectId: "fed-assignment-9c219",
      storageBucket: "fed-assignment-9c219.firebasestorage.app",
      messagingSenderId: "287410844855",
      appId: "1:287410844855:web:8c15e5cbe42c321b1e0932"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.resetPassword = function () {
      const email = document.getElementById("resetEmail").value;

      if (!email) {
        alert("Please enter your email.");
        return;
      }

      sendPasswordResetEmail(auth, email)
  .then(() => {
    // store email so next page can show it
    localStorage.setItem("resetEmail", email);
    window.location.href = "reset-sent.html";
  })
        .catch((error) => {
          alert(error.message);
        });
    };
  </script>

</body>
</html>
