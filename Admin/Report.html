<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports</title>
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#3b3fc4;
  --card1:#0b1633;
  --card2:#0f1e45;
  --text-muted:#c7d2fe;
  --accent:#d946ef;
  --accent-blue:#22d3ee;
}

/* RESET */
*{margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI",sans-serif;}
body{
  min-height:100vh; display:flex; color:white; position:relative; overflow-x:hidden;
  background: linear-gradient(120deg,#3b3fc4,#4361ee,#0f1e45,#3b3fc4);
  background-size: 400% 400%;
  animation: gradientShift 15s ease infinite;
}

/* Floating blobs */
.blob{
  position:absolute;
  width:150px; height:150px;
  background: rgba(34,211,238,0.2);
  border-radius:50%;
  animation: float 12s ease-in-out infinite;
}
.blob:nth-child(1){ top:10%; left:75%; animation-delay:0s; }
.blob:nth-child(2){ top:40%; left:15%; animation-delay:4s; }
.blob:nth-child(3){ top:65%; left:80%; animation-delay:8s; }
@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(50px);}
}
@keyframes gradientShift{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* SIDEBAR */
.sidebar{
  width:240px; background: linear-gradient(180deg,#4361ee,#3a0ca3);
  border-radius:0 40px 40px 0; padding:24px 16px; display:flex; flex-direction:column;
}
.sidebar h2{margin-bottom:20px;font-size:20px;}
.sidebar .search{background:rgba(0,0,0,0.3); padding:8px 12px; border-radius:10px; margin-bottom:20px;}
.sidebar input{background:transparent;border:none;outline:none;color:white;width:100%;}
.menu a{display:flex;align-items:center;padding:12px;margin-bottom:10px;border-radius:10px;color:#e0e7ff;text-decoration:none;font-size:14px;transition: all 0.3s ease;}
.menu a i{margin-right:8px;}
.menu a.active,.menu a:hover{background: rgba(0,0,0,0.25); transform: translateX(5px);}
.profile{margin-top:auto; display:flex;align-items:center; gap:10px; font-size:13px;}
.avatar{width:34px; height:34px; background:var(--accent-blue); border-radius:50%;}

/* MAIN CONTENT */
.main{flex:1; padding:24px 30px;}
.topbar{display:flex; align-items:center; gap:20px; margin-bottom:30px;}
.topbar h1{font-size:20px;}
.top-search{background:white; border-radius:20px; padding:8px 14px; width:260px;}
.top-search input{border:none; outline:none; width:100%;}

/* CARD */
.card{
  background:linear-gradient(180deg,var(--card1),var(--card2));
  border-radius:22px; padding:25px;
  box-shadow:0 20px 40px rgba(0,0,0,.5), 0 0 20px rgba(219, 39, 119, 0.4);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.card:hover{transform: translateY(-5px); box-shadow:0 25px 50px rgba(0,0,0,0.6), 0 0 25px rgba(219, 39, 119, 0.6);}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.card-actions{display:flex;gap:10px;}
.card-actions select{background:#0f2557;border:none;color:white;padding:6px 10px;border-radius:8px;}
.badge{background:var(--accent);padding:6px 14px;border-radius:10px;font-size:14px;}

/* TABLE */
table{width:100%; border-collapse:collapse;}
th{text-align:left; font-size:12px; color:var(--text-muted); padding-bottom:12px;}
td{padding:18px 0; border-top:1px solid rgba(255,255,255,0.08); font-size:14px;}
tbody tr:hover{background: rgba(255,255,255,0.1); transform: translateX(5px); transition: all 0.3s ease;}
.owner-email{font-size:12px; color:var(--text-muted);}
.status{font-weight:600;}
.completed{color:#22d3ee; animation: pulse 2s infinite;}
.expired{color:#f87171;}
.active{color:#34d399;}
.ended{color:#facc15;}
.closed{color:#a78bfa;}
.pending{color:#fb923c;}
@keyframes pulse{0%,100%{text-shadow:0 0 5px #22d3ee;}50%{text-shadow:0 0 15px #22d3ee;}}

/* MODAL */
.modal{position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; justify-content:center; align-items:center; opacity:0; transition: opacity 0.3s ease;}
.modal.show{display:flex; opacity:1;}
.modal-box{background:#081a3b; padding:20px; border-radius:15px; width:320px; transform: scale(0.8); transition: transform 0.3s ease;}
.modal.show .modal-box{transform: scale(1);}
.modal-box h3{margin-bottom:10px;}
.modal-box input,.modal-box select{width:100%; padding:8px; margin-top:10px; border:none; border-radius:8px;}
.modal-box button{margin-top:12px; padding:8px; border:none; border-radius:8px; cursor:pointer; transition: all 0.2s ease;}
.modal-box button:hover{background: rgba(219, 39, 119, 0.4);}

/* SLIDE-IN ANIMATION FOR ROWS */
tbody tr{transform: translateX(-100%); opacity:0;}
tbody tr.show{animation: slideIn 0.5s forwards;}
@keyframes slideIn{to{transform:translateX(0); opacity:1;}}
</style>
</head>
<body>

<!-- floating blobs -->
<div class="blob"></div>
<div class="blob"></div>
<div class="blob"></div>

<!-- SIDEBAR -->
<aside class="sidebar">
  <h2>Vendor Management</h2>
  <div class="search"><input type="text" placeholder="Search for..." /></div>
  <nav class="menu">
    <a href="Home.html"><i class="fas fa-home"></i> Home</a>
    <a href="Analytics.html"><i class="fas fa-chart-line"></i> Analytics</a>
    <a class="active" href="Report.html"><i class="fas fa-file-alt"></i> Reports</a>
  </nav>
  <div class="profile"><div class="avatar"></div>John Carter</div>
</aside>

<!-- MAIN -->
<main class="main">
  <div class="topbar">
    <h1>Reports</h1>
    <div class="top-search"><input placeholder="Search anything here..." /></div>
  </div>

  <div class="card">
    <div class="card-header">
      <h3>Contract Status</h3>
      <div class="card-actions">
        <select><option>Placeholder</option></select>
        <span class="badge">Default</span>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Stall owner</th>
          <th>Date</th>
          <th>Status</th>
          <th>Country</th>
          <th>Total</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</main>

<!-- MODAL -->
<div class="modal" id="editModal">
  <div class="modal-box">
    <h3>Edit Contract</h3>
    <input id="editOwner" placeholder="Stall Owner">
    <input id="editEmail" placeholder="Email">
    <input id="editCountry" placeholder="Country">
    <input id="editTotal" placeholder="Total">
    <select id="editStatus">
      <option>Completed</option>
      <option>Expired</option>
      <option>Active</option>
      <option>Ended</option>
      <option>Closed</option>
      <option>Pending</option>
    </select>
    <button onclick="saveEdit()">Save</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
let contracts=[
  {owner:"John Carter",email:"contact@johncarter.com",date:"Jan 30, 2024",status:"Completed",country:"United States",total:"$1,090.24"},
  {owner:"Sophie Moore",email:"contact@sophiemoore.com",date:"Jan 27, 2024",status:"Expired",country:"United Kingdom",total:"$870.32"},
  {owner:"Matt Cannon",email:"info@mattcannon.com",date:"Jan 24, 2024",status:"Active",country:"Australia",total:"$1,899.48"},
  {owner:"Graham Hills",email:"hello@grahamhills.com",date:"Jan 21, 2024",status:"Ended",country:"India",total:"$1,580.12"}
];

let editIndex=null;
const tableBody=document.getElementById('tableBody');
const editModal=document.getElementById('editModal');
const editOwner=document.getElementById('editOwner');
const editEmail=document.getElementById('editEmail');
const editCountry=document.getElementById('editCountry');
const editTotal=document.getElementById('editTotal');
const editStatus=document.getElementById('editStatus');

function renderTable(){
  tableBody.innerHTML="";
  contracts.forEach((c,i)=>{
    const row=document.createElement('tr');
    row.innerHTML=`
      <td>${c.owner}<br><span class="owner-email">${c.email}</span></td>
      <td>${c.date}</td>
      <td class="status ${c.status.toLowerCase()}">${c.status}</td>
      <td>${c.country}</td>
      <td>${c.total}</td>
      <td class="actions"><span onclick="openEdit(${i})">✎</span></td>
    `;
    tableBody.appendChild(row);
    setTimeout(()=>{row.classList.add('show');}, i*150);
  });
}
renderTable();

function openEdit(i){
  editIndex=i;
  let c=contracts[i];
  editOwner.value=c.owner;
  editEmail.value=c.email;
  editCountry.value=c.country;
  editTotal.value=c.total;
  editStatus.value=c.status;
  editModal.classList.add('show');
}

function saveEdit(){
  contracts[editIndex]={...contracts[editIndex],owner:editOwner.value,email:editEmail.value,country:editCountry.value,total:editTotal.value,status:editStatus.value};
  closeModal();
  renderTable();
}

function closeModal(){ editModal.classList.remove('show'); }

// SEARCH FILTER
document.querySelector('.top-search input').addEventListener('input', e=>{
  const query=e.target.value.toLowerCase();
  contracts.forEach((c,i)=>{
    const row=tableBody.children[i];
    const match=Object.values(c).some(v=>v.toLowerCase().includes(query));
    row.style.display=match?'':'none';
  });
});
</script>
</body>
</html>
