<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Officer Portal</title>

  <!-- Font Awesome Icons -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    rel="stylesheet"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", Arial, sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(180deg, #1f5cff, #0b2fa8);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page {
      width: 100%;
      max-width: 380px;
      height: 100vh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Back arrow */
    .back {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 18px;
      cursor: pointer;
    }

    /* Header */
    .header {
      text-align: center;
      margin-top: 40px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 600;
    }

    .header p {
      font-size: 13px;
      opacity: 0.85;
      margin-top: 6px;
    }

    /* Logo */
    .logo {
      margin: 28px 0;
      display: flex;
      justify-content: center;
    }

    .logo img {
      width: 230px;
      max-width: 100%;
      height: auto;
    }

    /* Form */
    .form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-group {
      position: relative;
    }

    .input-group i {
      position: absolute;
      top: 50%;
      left: 16px;
      transform: translateY(-50%);
      opacity: 0.8;
    }

    .input-group .eye {
      right: 16px;
      left: auto;
      cursor: pointer;
    }

    .input-group input {
      width: 100%;
      padding: 14px 48px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.4);
      background: transparent;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    .input-group input::placeholder {
      color: rgba(255,255,255,0.7);
    }

    .forgot {
      font-size: 13px;
      opacity: 0.85;
      margin-left: 6px;
    }

    /* Button */
    .login-btn {
      margin-top: 10px;
      padding: 14px;
      border-radius: 30px;
      border: none;
      background: #ffffff;
      color: #1f5cff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    /* Access link */
    .access {
      text-align: center;
      font-size: 13px;
      margin-top: 16px;
    }

    .access a {
      color: #ffffff;
      font-weight: 600;
      text-decoration: none;
    }

    /* Footer */
    .footer {
      font-size: 11px;
      opacity: 0.75;
      text-align: center;
      margin-bottom: 12px;
    }
    .forgot a {
  color: #ffffff;
  text-decoration: none;
  font-size: 13px;
  opacity: 0.85;
}

  </style>
</head>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBc5jOMf7hfbWa_65JFcdAMwSKyxtLSCvs",
  authDomain: "fed-assignment-9c219.firebaseapp.com",
  projectId: "fed-assignment-9c219",
  storageBucket: "fed-assignment-9c219.firebasestorage.app",
  messagingSenderId: "287410844855",
  appId: "1:287410844855:web:8c15e5cbe42c321b1e0932",
  measurementId: "G-CJBDRY9RQ5"
};
// Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Login function
  window.login = function () {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    signInWithEmailAndPassword(auth, email, password)
      .then((userCredential) => {
        alert("Login successful!");
        // redirect after login
        window.location.href = "dashboard.html";
      })
      .catch((error) => {
        alert(error.message);
      });
  };
</script>
<body>
  <div class="page">

    <!-- Back arrow -->
    <div class="back">
      <i class="fas fa-chevron-left"></i>
    </div>

    <!-- Header -->
    <div class="header">
      <h1>Officer Portal</h1>
      <p>National Environment Agency</p>

      <div class="logo">
        <img src="image/NEA-logo.png" alt="National Environment Agency Logo">
      </div>
    </div>

    <!-- Form -->
    <div class="form">
      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="email" id="email" placeholder="email">
      </div>

      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="password">
        <i class="fas fa-eye eye"></i>
      </div>

      <div class="forgot">
  <a href="forgot-password.html">Forgot password?</a>
</div>


      <button class="login-btn" onclick="login()">LOGIN</button>

      <div class="access">
        Need access? <a href="#">Contact Administrator</a>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      Authorized personnel only. All activities are monitored and logged.
    </div>

  </div>
</body>
</html>
