<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management | HawkerHub</title>
    <link rel="stylesheet" href="../css/design-tokens.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <nav class="sidebar">
        <div>
            <div class="brand">
                <div class="brand-icon"><i class="fas fa-store"></i></div>
                HawkerHub
            </div>
            <ul class="nav-links">
                <li><a href="index.html"><i class="fas fa-th-large"></i> Overview</a></li>
                <li><a href="orders.html" class="active"><i class="fas fa-clipboard-list"></i> Order Management</a></li>
                <li><a href="menu.html"><i class="fas fa-utensils"></i> Menu Items</a></li>
                <li><a href="notifications.html"><i class="fas fa-bell"></i> Notifications</a></li>
                <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
            </ul>
        </div>
        <div class="user-profile">
            <div class="user-avatar"></div>
            <div>
                <div style="font-weight: bold; font-size: 14px;">Uncle Tan</div>
                <div style="font-size: 12px; color: #777;">Stall #04-21</div>
            </div>
        </div>
        <div class="account-actions">
            <a class="sign-out-link" href="../login.html">
                <i class="fas fa-sign-out-alt"></i> Sign out
            </a>
        </div>

    </nav>

    <main class="main-content">
        <header style="height: 80px !important; min-height: 80px !important; background-color: #1A237E; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: space-between; padding: 0 30px;">

            <div class="header-title">
                <i class="fas fa-bars" style="margin-right: 15px; cursor: pointer; color: white; font-size: 22px;"></i>
                <strong style="font-size: 22px;">Uncle Lim Chicken Rice</strong>
            </div>

            <div class="header-icons">
                <div style="display: flex; align-items: center; gap: 10px; margin-right: 30px; background: rgba(255,255,255,0.15); padding: 6px 16px; border-radius: 30px;">
                    <span style="font-size: 13px; color: #eee; font-weight: 500;">Store Status</span>
                    <i class="fas fa-toggle-on" style="color: #69F0AE; font-size: 24px;"></i>
                    <span style="font-size: 13px; font-weight: bold; color: white;">OPEN</span>
                </div>

                <i class="fas fa-bell" style="color: white; font-size: 20px; margin-right: 20px; cursor: pointer;"></i>

                <div class="user-avatar" style="width: 40px; height: 40px; background-color: white; color: #1A237E; display:flex; align-items:center; justify-content:center; border-radius: 50%; font-weight:bold; font-size:15px;">UT</div>
            </div>
        </header>

        <div class="dashboard-container">

            <div class="orders-toolbar">
                <h2 style="margin: 0; display: flex; align-items: center; font-size: 22px;">
                    Order Management
                    <span class="live-badge">LIVE</span>
                </h2>
                <button class="btn-walkin" id="new-walkin-btn" type="button">
                    <i class="fas fa-plus"></i> NEW WALK-IN ORDER
                </button>
            </div>

            <div class="kanban-board">

                <div class="kanban-column col-new">
                    <div class="col-header">
                        <span><i class="fas fa-receipt" style="color: #FF5252; margin-right: 8px;"></i> New Orders</span>
                        <span class="count-badge" id="count-new">0</span>
                    </div>
                    <div id="list-new"></div>
                </div>

                <div class="kanban-column col-cooking">
                    <div class="col-header">
                        <span><i class="fas fa-fire" style="color: #FFB74D; margin-right: 8px;"></i> Cooking</span>
                        <span class="count-badge" id="count-cooking">0</span>
                    </div>
                    <div id="list-cooking"></div>
                </div>

                <div class="kanban-column col-ready">
                    <div class="col-header">
                        <span><i class="fas fa-check-circle" style="color: #2ECC71; margin-right: 8px;"></i> Ready</span>
                        <span class="count-badge" id="count-ready">0</span>
                    </div>
                    <div id="list-ready"></div>
                </div>

            </div>
        </div>
    </main>

    <nav class="mobile-nav" aria-label="Vendor bottom navigation">
        <a href="index.html" class="mobile-nav-link">
            <i class="fas fa-th-large" aria-hidden="true"></i>
            <span>Overview</span>
        </a>
        <a href="orders.html" class="mobile-nav-link active">
            <i class="fas fa-clipboard-list" aria-hidden="true"></i>
            <span>Orders</span>
        </a>
        <a href="menu.html" class="mobile-nav-link">
            <i class="fas fa-utensils" aria-hidden="true"></i>
            <span>Menu</span>
        </a>
        <a href="notifications.html" class="mobile-nav-link">
            <i class="fas fa-bell" aria-hidden="true"></i>
            <span>Notifications</span>
        </a>
        <a href="settings.html" class="mobile-nav-link">
            <i class="fas fa-cog" aria-hidden="true"></i>
            <span>Settings</span>
        </a>
    </nav>

    <script src="../js/app-firebase.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-init.js"></script>

    <script src="js/orders.js"></script>
</body>
</html>
